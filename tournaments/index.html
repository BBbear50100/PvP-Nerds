<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The PvP NERDS · Tournaments</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<style>
:root{--bg:#f5f4fb;--card:#fff;--ink:#16142a;--mute:#6b6a85;--line:#dcd9ee;--acc:#6d4aff;--acc2:#ff5c8a;--ok:#12a36b;--shadow:0 8px 30px rgba(40,30,100,.09)}
@media (prefers-color-scheme:dark){:root:not([data-mode="light"]){--bg:#0e0d1a;--card:#18172b;--ink:#f1f0fb;--mute:#9b9ab8;--line:#34334f;--shadow:0 8px 30px rgba(0,0,0,.4)}}
:root[data-mode="dark"]{--bg:#0e0d1a;--card:#18172b;--ink:#f1f0fb;--mute:#9b9ab8;--line:#34334f;--shadow:0 8px 30px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;cursor:pointer}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-style:normal}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:12px;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.p{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 78%,white));color:#fff;border:0}
.btn.d{color:#e5484d}.btn.s{padding:6px 11px;font-size:13px;border-radius:9px}
main{max-width:1240px;margin:auto;padding:24px 20px 60px}
.hero{padding:26px;border-radius:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;margin-bottom:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h1{margin:0;font-size:28px;letter-spacing:-.02em}.hero p{margin:4px 0 0;opacity:.9}
.stats{display:flex;gap:10px;margin-left:auto}.stat{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 16px;text-align:center}.stat b{display:block;font-size:22px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.tab{padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:14px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card)}
#q{max-width:240px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.card:hover{transform:translateY(-3px)}
.card h3{margin:8px 0 2px;font-size:18px}.mute{color:var(--mute);font-size:13px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.b-live{background:color-mix(in srgb,var(--acc2) 13%,transparent);color:var(--acc2)}.b-soon{background:#8884;color:var(--mute)}.b-done{background:#12a36b22;color:var(--ok)}
.meta{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
.chip.w{border-color:var(--ok)}.chip b{cursor:pointer;color:var(--mute)}
.scroll{overflow-x:auto;padding-bottom:12px}
.flow{position:relative}.flow svg{position:absolute;left:0;top:0}
.flow path{fill:none;stroke:var(--line);stroke-width:2}.flow path.on{stroke:var(--acc)}
.fh{position:absolute;top:0;text-align:center;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.m{position:absolute;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.pl{position:relative;display:flex;justify-content:space-between;align-items:center;padding:0 12px;height:50%;gap:8px;font-size:14px;transition:background .2s,opacity .3s}.pl>*{position:relative}
.pl+.pl{border-top:1px solid var(--line)}
.pl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.w{font-weight:700}.pl.w::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 25%,transparent),color-mix(in srgb,var(--acc2) 15%,transparent))}.pl.l{opacity:.45;text-decoration:line-through}
.pl.k{cursor:pointer}.pl.k:hover{background:var(--bg)}
.tbd{color:var(--mute);font-style:italic}
.cb{position:absolute;border-radius:14px;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#ffd45e,#ff9d4a);color:#3a2300;font-weight:800;padding:6px}
.champ{text-align:center;padding:18px;border-radius:18px;background:linear-gradient(135deg,#ffd45e,#ff9d4a);color:#3a2300;font-size:20px;font-weight:800;margin-bottom:18px}
.empty{text-align:center;padding:60px 20px;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(10,8,30,.55);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{background:var(--card);border-radius:20px;padding:24px;width:min(480px,100%);display:grid;gap:12px}
.modal label{font-size:13px;font-weight:600;display:grid;gap:5px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30}
.t{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;box-shadow:var(--shadow)}
.mgr{background:color-mix(in srgb,var(--acc) 10%,transparent);border:1px dashed var(--acc);border-radius:12px;padding:8px 14px;font-size:13px;margin-bottom:16px}
html{scroll-behavior:smooth}
.btn,.tab{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent}
.tab{transition:background .2s,color .2s,transform .15s,border-color .2s}.tab:hover{transform:translateY(-1px)}
.btn:active,.tab:active{transform:scale(.95)}.card:active{transform:scale(.98)}
input{transition:border-color .2s,box-shadow .2s}input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 19%,transparent)}
.chip{transition:opacity .3s,border-color .3s}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.pl.w.new::before,.pl.w.bw::before{transform-origin:left;animation:sweep .6s var(--d,0s) cubic-bezier(.2,.8,.2,1) backwards}
.pl.w.new{animation:glow 1.1s ease-out}.pl.l.new{animation:dim .5s}
.pl.in{animation:slide .5s var(--s,.3s) cubic-bezier(.2,.8,.2,1) backwards}.pl.l.bw{opacity:1;text-decoration:none}.pl.l.bw>span:first-child{animation:dimb .5s var(--d,0s) both}
.ck{display:inline-block}.new .ck,.bw .ck{animation:pop .5s calc(var(--d,0s) + .2s) cubic-bezier(.3,1.6,.5,1) backwards}
.flow path{transition:stroke .3s}.flow path.bf{stroke-dasharray:1;animation:draw .42s var(--d,0s) ease-out backwards}.flow path.wf{stroke-dasharray:1;animation:draw .5s var(--d,0s) ease-out backwards}.flow path.draw{stroke-dasharray:1;animation:draw .7s .25s ease-out backwards}
.cb.new,.champ.new{animation:pop .75s cubic-bezier(.3,1.5,.5,1)}
.enter>:not(#list):not(.champ){animation:up .5s cubic-bezier(.2,.8,.2,1) backwards}
.enter>:nth-child(2){animation-delay:.07s}.enter>:nth-child(3){animation-delay:.14s}.enter>:nth-child(4){animation-delay:.21s}.enter>:nth-child(5){animation-delay:.28s}
.enter .card{animation:up .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms + .12s)}
.enter .m,.enter .cb,.enter .fh{animation:zoom .45s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
.ov{animation:fin .2s}.modal{animation:zoom .3s cubic-bezier(.2,.8,.2,1)}
.ov.out{animation:fout .18s forwards}.ov.out .modal{animation:zout .18s forwards}
.t{animation:up .3s backwards}
.cf{position:fixed;top:-20px;width:8px;height:12px;border-radius:2px;z-index:40;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes dimb{from{opacity:1;text-decoration-line:none}to{opacity:.45;text-decoration-line:line-through}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes glow{from{box-shadow:inset 0 0 0 2px var(--acc),0 0 0 0 color-mix(in srgb,var(--acc) 50%,transparent)}to{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 0%,transparent),0 0 0 14px color-mix(in srgb,var(--acc) 0%,transparent)}}
@keyframes dim{from{opacity:1}to{opacity:.45}}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes zoom{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0}to{opacity:1}}
@keyframes fout{to{opacity:0}}@keyframes zout{to{opacity:0;transform:scale(.95)}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg)}}

.cb.cbw{animation:pop .7s var(--d,0s) cubic-bezier(.3,1.5,.5,1) backwards}
.champ.bwc{animation:pop .7s var(--d,0s) cubic-bezier(.3,1.5,.5,1) backwards}
.sws{display:flex;gap:12px;flex-wrap:wrap;padding:4px}
.sw{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 0 2px var(--card),0 0 0 4px transparent;transition:box-shadow .2s,transform .2s}
.sw:hover{transform:scale(1.1)}.sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink);transform:scale(1.1)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:9px;cursor:pointer;font-weight:600;transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--card);box-shadow:var(--shadow)}
#toast{width:max-content;max-width:92vw}.t{text-align:center}
.fit{overflow:visible;width:100%}.fit .flow{transform-origin:0 0}
.rt{font-style:normal;display:flex;gap:8px;align-items:center}.sc{font-variant-numeric:tabular-nums;font-weight:700}
.m.k{cursor:pointer;transition:border-color .2s,transform .15s}.m.k:hover{border-color:var(--acc)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.side{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;transition:border-color .3s,box-shadow .3s}
.side.w{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.dn{font-weight:700;overflow-wrap:anywhere}.big{font-size:38px;font-weight:800;line-height:1.1}.big.bump{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.vs{color:var(--mute);font-weight:700;font-size:13px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
.emb .logo,.emb #sign{display:none}
.emb:not(.isMgr) header{display:none}
html.emb{--bg:#080b14;--card:#111729;--ink:#eef1fb;--mute:#8791b0;--line:#222c48;--shadow:0 8px 30px rgba(0,0,0,.4)}
html.emb body{background:radial-gradient(900px 520px at 12% -6%,#1d2a5a77,transparent),radial-gradient(800px 520px at 92% 0,#5a1d6a44,transparent),#080b14;background-attachment:fixed}

</style>
<script src="../px.js"></script></head>
<body>
<header><div class="bar">
<div class="logo" onclick="nav(null)"><i>🏆</i>The PvP NERDS</div><div class="sp"></div>
<button class="btn p" id="new" hidden>+ New tournament</button>
<button class="btn" id="set" hidden>⚙ Settings</button>
<button class="btn" id="sign">Manager sign in</button>
</div></header>
<main><div id="app"><div class="empty">Loading…</div></div></main>
<div id="modal"></div><div id="toast"></div>
<script>
const NS=(location.pathname.split('/')[1]||'root')+':';
const DP=(a=>a.slice(2,-1).length?a.slice(2,-1).join('/')+'/data.json':'data.json')(location.pathname.split('/'));
if(top!==self)document.documentElement.classList.add('emb');
const THEMES={violet:['#6d4aff','#ff5c8a','Violet'],ocean:['#0a84ff','#00c2c7','Ocean'],emerald:['#0f9d6b','#7ccf3a','Emerald'],sunset:['#f2622c','#f5a31a','Sunset'],crimson:['#d81e4a','#ff7a59','Crimson'],slate:['#475569','#8b9ab8','Slate']},DEF_THEME={accent:'violet',mode:'auto'};
const FS=800,FW=900,tw=n=>n*FS+650;
const DEFAULT_HASH='c9728467a0d54189c8edc97cb9ef8e816a0e6b05a23e9d833bd9f30787722470';
let D={pwHash:DEFAULT_HASH,tournaments:[],theme:{...DEF_THEME}},mgr=top!==self?sessionStorage[NS+'sm']==='1':sessionStorage[NS+'mgr']==='1',view=null,filter='all',q='',chain=Promise.resolve(),timer,fx=false,last=null,bld=false,pend=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const st=t=>!t.rounds?'soon':t.rounds[t.rounds.length-1][0].w?'done':'live';
const LBL={soon:'Upcoming',live:'Live',done:'Completed'};
const pn=(t,id)=>id?(t.players.find(p=>p.id===id)||{}).name:null;
const cur=()=>D.tournaments.find(t=>t.id===view);
let tt;function toast(m,ms=3500){$('#toast').innerHTML='<div class="t">'+esc(m)+'</div>';clearTimeout(tt);tt=setTimeout(()=>$('#toast').innerHTML='',ms)}
function repo(){if(localStorage[NS+'repo'])return localStorage[NS+'repo'];const h=location.hostname;if(!h.endsWith('github.io'))return'';
 let s=location.pathname.split('/')[1];if(!s||s.endsWith('.html'))s=h;return h.split('.')[0]+'/'+s}
async function load(){let d=null;const r=repo();
 if(r){try{const x=await fetch(`https://api.github.com/repos/${r}/contents/${DP}`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(x.ok)d=await x.json()}catch(e){}}
 if(!d){try{d=await(await fetch('data.json?'+Date.now())).json()}catch(e){}}
 if(d){D={pwHash:d.pwHash||DEFAULT_HASH,tournaments:d.tournaments||[],theme:{...DEF_THEME,...(d.theme||{})}};applyTheme(D.theme)}}
function applyTheme(th){const v=THEMES[th&&th.accent]||THEMES.violet,r=document.documentElement;r.style.setProperty('--acc',v[0]);r.style.setProperty('--acc2',v[1]);const m=th&&th.mode;if(m==='light'||m==='dark')r.dataset.mode=m;else delete r.dataset.mode;try{localStorage[NS+'th']=JSON.stringify(th)}catch(e){}}
function save(){render();clearTimeout(timer);timer=setTimeout(()=>{chain=chain.then(push)},1000)}
async function push(){const tk=(localStorage[NS+'tk']||'').replace(/^(bearer|token)\s+/i,'').replace(/[\s"']/g,''),r=(repo()||'').trim();
 if(!tk||!r){toast('Add your GitHub token (and repo) in Settings to publish changes',6000);return false}
 const u=`https://api.github.com/repos/${r}/contents/${DP}`,h={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
 const why=async x=>{let m='';try{m=(await x.json()).message||''}catch(e){}const c=x.status;
  return c===401?'Token rejected (401). It may be expired or copied wrong. Create a fresh one.'
  :c===403||c===404?`GitHub refused (${c}${m?': '+m:''}). Check the repo is "${r}" and that the token has access to it with Contents set to Read and write.`
  :`GitHub could not save (${c}${m?': '+m:''})`};
 try{for(let a=0;a<3;a++){
  const g=await fetch(u+'?t='+Date.now(),{headers:h,cache:'no-store'});
  if(!g.ok&&g.status!==404){toast(await why(g),9000);return false}
  const j=g.ok?await g.json():null,sha=j&&!Array.isArray(j)?j.sha:undefined;
  const body={message:'Update tournaments',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1))))};if(sha)body.sha=sha;
  const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(body)});
  if(p.ok){toast('Saved ✓');return true}
  if((p.status===422||p.status===409)&&a<2){await new Promise(z=>setTimeout(z,700));continue}
  toast(await why(p),10000);return false}}
 catch(e){toast('Network error: '+e.message+'. If you pasted the token, re-copy it without extra characters.',9000);return false}}
async function testConn(){localStorage[NS+'tk']=$('#s_tk').value.trim();localStorage[NS+'repo']=$('#s_repo').value.trim();toast('Testing connection…');await push()}
/* bracket logic */
const TARGET=5;let cm=null,pl=null;
function norm(t){const R=t.rounds;R.forEach((rd,r)=>rd.forEach((m,i)=>{
 if(r>0){m.a=R[r-1][2*i].w||null;m.b=R[r-1][2*i+1]?R[r-1][2*i+1].w||null:null}
 if(m.log&&m.log.some(x=>x!==m.a&&x!==m.b))m.log=[];
 if(m.log&&m.log.length){const ca=m.log.filter(x=>x===m.a).length,cb=m.log.length-ca;m.w=ca>=TARGET?m.a:cb>=TARGET?m.b:null}
 else if(m.w&&m.w!==m.a&&m.w!==m.b)m.w=null;
 const bye=r===0?!m.b:2*i+1>=R[r-1].length;
 if(bye&&m.a&&!m.w)m.w=m.a;
 if(r===0&&!m.a&&m.b&&!m.w)m.w=m.b}))}
function start(t){const ids=t.players.map(p=>p.id);
 for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
 let c=Math.ceil(ids.length/2);
 t.rounds=[Array.from({length:c},(_,i)=>({a:ids[2*i],b:ids[2*i+1]||null,w:null,log:[]}))];
 while(c>1){c=Math.ceil(c/2);t.rounds.push(Array.from({length:c},()=>({a:null,b:null,w:null,log:[]})))}norm(t)}
const rname=(i,n,c)=>c===1?'Final':c===2?'Semifinals':c===4?'Quarterfinals':'Round '+(i+1);
/* match menu */
function openMatch(r,i){if(!mgr)return;const m=cur().rounds[r][i];if(!m.a||!m.b)return;cm={r,i};modal(matchBody())}
function refreshMatch(){const e=document.querySelector('.modal');if(e&&cm)e.innerHTML=matchBody()}
function matchBody(){const t=cur(),{r,i}=cm,m=t.rounds[r][i],A=m.a,B=m.b,log=m.log||[],ca=log.filter(x=>x===A).length,cb=log.length-ca,done=!!m.w,last1=log[log.length-1],nm=id=>esc(pn(t,id));
 const side=(id,c)=>`<div class="side ${m.w===id?'w':''}"><div class="dn">${nm(id)}</div><div class="big${last1===id?' bump':''}">${c}</div></div>`;
 return `<div class="row"><h3 style="margin:0">${rname(r,t.rounds.length,t.rounds[r].length)} · Match ${i+1}</h3><div class="sp"></div></div>
 <div class="mute">First to ${TARGET} wins. After each game, pick who won it.</div>
 <div class="duel">${side(A,ca)}<div class="vs">VS</div>${side(B,cb)}</div>
 ${done?`<div class="champ" style="padding:10px;font-size:17px;margin:0">🏆 ${nm(m.w)} wins${log.length?` ${Math.max(ca,cb)}–${Math.min(ca,cb)}`:''}</div>`
 :`<div class="mute">Game ${log.length+1}: who won?</div><div class="row"><button class="btn p" style="flex:1" onclick="point('${A}')">${nm(A)}</button><button class="btn p" style="flex:1" onclick="point('${B}')">${nm(B)}</button></div>`}
 ${log.length?`<div class="plist" style="margin:0">${log.map((id,k)=>`<span class="chip">G${k+1} · ${nm(id)}</span>`).join('')}</div>`:''}
 <div class="row">${log.length||m.w?'<button class="btn s" onclick="undoPoint()">↶ Undo last</button>':''}${!done?`<button class="btn s" onclick="forceWin('${A}')">Award ${nm(A)} the win</button><button class="btn s" onclick="forceWin('${B}')">Award ${nm(B)} the win</button>`:''}<div class="sp"></div><button class="btn p" onclick="closeModal()">Done</button></div>`}
function point(id){const t=cur(),m=t.rounds[cm.r][cm.i];if(m.w||!m.a||!m.b)return;m.log=m.log||[];m.log.push(id);norm(t);
 if(m.w)pl={r:cm.r,i:cm.i,id:m.w,t:t.id};save();refreshMatch()}
function undoPoint(){const t=cur(),m=t.rounds[cm.r][cm.i];if(m.log&&m.log.length)m.log.pop();else m.w=null;norm(t);pl=null;save();refreshMatch()}
function forceWin(id){const t=cur(),m=t.rounds[cm.r][cm.i];m.log=[];m.w=id;norm(t);pl={r:cm.r,i:cm.i,id,t:t.id};save();refreshMatch()}
/* flow chart */
function flow(t){const W=176,H=62,GX=36,GY=18,T=30,R=t.rounds,n=R.length,pos=[],nw=last&&last.t===t.id,Tw=tw(n);
 const dv=v=>bld?`--d:${Math.round(v)}ms;`:'';
 R.forEach((rd,r)=>pos[r]=rd.map((m,i)=>{if(r===0)return i*(H+GY);const a=pos[r-1][2*i],b=pos[r-1][2*i+1];return b===undefined?a:(a+b)/2}));
 const X=r=>r*(W+GX),w=(n+1)*(W+GX)-GX,h=T+pos[0].length*(H+GY)-GY;let pb='',po='',b='';
 R.forEach((rd,r)=>{b+=`<div class="fh" style="${dv(r*FS)}left:${X(r)}px;width:${W}px">${rname(r,n,rd.length)}</div>`;
  rd.forEach((m,i)=>{const y=T+pos[r][i],bye=r===0?!m.b:2*i+1>=R[r-1].length,log=m.log||[],ca=log.filter(x=>x===m.a).length,open=mgr&&m.a&&m.b;
   if(r>0)[2*i,2*i+1].filter(j=>j<R[r-1].length).forEach(j=>{const f=R[r-1][j],y1=T+pos[r-1][j]+H/2,xm=X(r)-GX/2,d=`M${X(r-1)+W} ${y1}H${xm}V${y+H/2}H${X(r)}`;
    pb+=`<path pathLength="1" class="${bld?'bf':''}" style="${dv((r-1)*FS+420)}" d="${d}"/>`;
    if(f.w)po+=`<path pathLength="1" class="on ${bld?'wf':nw&&last.r===r-1&&last.i===j?'draw':''}" style="${dv(Tw+(r-1)*FW+350)}" d="${d}"/>`});
   b+=`<div class="m${open?' k':''}" ${open?`onclick="openMatch(${r},${i})"`:''} style="${dv(r*FS+Math.min(i,10)*60)}left:${X(r)}px;top:${y}px;width:${W}px;height:${H}px">${[m.a,m.b].map((id,si)=>{
    const nm=id?esc(pn(t,id)):`<span class="tbd">${r===0||(si===1&&bye)?'BYE':'TBD'}</span>`;
    const c=m.w?(m.w===id?'w':'l'):'',
     nn=bld?(m.w&&id?' bw':''):(nw&&m.w&&last.r===r&&last.i===i?' new':''),
     inn=bld?(r>0&&id?' in':''):(nw&&last.r===r-1&&(last.i>>1)===i&&id===last.id?' in':''),
     sv=bld?`--d:${Math.round(Tw+r*FW)}ms;--s:${Math.round(Tw+(r-1)*FW+750)}ms;`:'';
    const sc=id&&log.length?`<span class="sc">${si===0?ca:log.length-ca}</span>`:'';
    return `<div class="pl ${c}${nn}${inn}" style="${sv}">${id?`<span>${nm}</span>`:nm}<em class="rt">${m.w&&m.w===id?'<span class="ck">✓</span>':''}${sc}</em></div>`}).join('')}</div>`})});
 const f=R[n-1][0],y=T+pos[n-1][0],Te=Tw+(n-1)*FW,cst=`left:${X(n)}px;top:${y}px;width:${W}px;height:${H}px`,cd=`M${X(n-1)+W} ${y+H/2}H${X(n)}`;
 pb+=`<path pathLength="1" class="${bld?'bf':''}" style="${dv((n-1)*FS+420)}" d="${cd}"/>`;
 if(f.w)po+=`<path pathLength="1" class="on ${bld?'wf':nw&&last.r===n-1?'draw':''}" style="${dv(Te+350)}" d="${cd}"/>`;
 b+=`<div class="cb${!bld&&nw&&last.r===n-1&&f.w?' new':''}" style="${dv(n*FS)}${cst}">🏆 ${f.w&&!bld?esc(pn(t,f.w)):'Champion?'}</div>`;
 if(f.w&&bld)b+=`<div class="cb cbw" style="${dv(Te+750)}${cst}">🏆 ${esc(pn(t,f.w))}</div>`;
 return `<div class="fit" data-w="${w}" data-h="${h}"><div class="flow" style="width:${w}px;height:${h}px"><svg width="${w}" height="${h}">${pb}${po}</svg>${b}</div></div>`}
function fit(){document.querySelectorAll('.fit').forEach(e=>{const w=+e.dataset.w,h=+e.dataset.h,a=e.clientWidth;if(!a)return;const k=Math.min(1,Math.floor(a/w*1000)/1000);e.style.height=Math.ceil(h*k)+'px';e.firstChild.style.transform=`scale(${k})`})}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>fit()).observe(document.querySelector('main'));
addEventListener('resize',fit);
/* views */
function card(t,i){const s=st(t),f=t.rounds&&t.rounds[t.rounds.length-1][0].w;
 return `<div class="card" style="--i:${i}" onclick="nav('${t.id}')"><span class="badge b-${s}">${s==='live'?'● ':''}${LBL[s]}</span>
 <h3>${esc(t.title)}</h3><div class="mute">${esc(t.server)}</div>
 <div class="meta"><span>🎁 ${esc(t.prize||'No reward')}</span><span>👥 ${t.players.length}${t.max?'/'+t.max:''}</span>${t.date?`<span>📅 ${esc(t.date)}</span>`:''}</div>
 ${f?`<div style="margin-top:10px;font-weight:700">🏆 ${esc(pn(t,f))}</div>`:''}</div>`}
const match=t=>(filter==='all'||st(t)===filter)&&(t.title+t.server).toLowerCase().includes(q.toLowerCase());
const listHtml=()=>{const l=D.tournaments.filter(match);return l.length?`<div class="grid">${l.map(card).join('')}</div>`:`<div class="empty"><div style="font-size:44px">🎮</div><h3>No tournaments here yet</h3><p>${mgr?'Hit “New tournament” to create one.':'Check back soon.'}</p></div>`};
const list=()=>$('#list').innerHTML=listHtml();
function home(){const c=s=>D.tournaments.filter(t=>st(t)===s).length;
 return `<div class="hero"><div><h1>Tournaments</h1><p>Live brackets, players and results.</p></div>
 <div class="stats"><div class="stat"><b>${c('live')}</b>Live</div><div class="stat"><b>${c('soon')}</b>Upcoming</div><div class="stat"><b>${c('done')}</b>Completed</div><div class="stat"><b>${D.tournaments.length}</b>Total</div></div></div>
 ${mgr?'<div class="mgr">Manager mode is on. Create tournaments, or open one to manage it.</div>':''}
 <div class="tools">${[['all','All'],['live','Live'],['soon','Upcoming'],['done','Completed']].map(([k,l])=>`<button class="tab ${filter===k?'on':''}" onclick="setFilter('${k}')">${l}</button>`).join('')}
 <input id="q" placeholder="Search…" value="${esc(q)}" oninput="q=this.value;refreshList()"></div><div id="list">${listHtml()}</div>`}
function detail(t){const s=st(t),f=t.rounds&&t.rounds[t.rounds.length-1][0];
 let h=`<button class="btn s" onclick="nav(null)">← All tournaments</button>
 <div class="panel" style="margin-top:14px"><div class="row"><div><span class="badge b-${s}">${LBL[s]}</span><h2 style="margin:6px 0 0">${esc(t.title)}</h2><div class="mute">${esc(t.server)}${t.date?' · '+esc(t.date):''}</div></div><div class="sp"></div>
 <div style="text-align:right"><div class="mute">Reward</div><b style="font-size:20px">🎁 ${esc(t.prize||'—')}</b></div></div>
 ${t.desc?`<p>${esc(t.desc)}</p>`:''}
 ${mgr?`<div class="row" style="margin-top:12px"><button class="btn s" onclick="openForm('${t.id}')">Edit details</button>
 ${!t.rounds?`<button class="btn s p" onclick="startT()">Start tournament</button>`:`<button class="btn s" onclick="resetT()">Reset bracket</button>`}
 <button class="btn s d" onclick="delT()">Delete</button></div>`:''}</div>`;
 if(f&&f.w)h+=`<div class="champ${last&&last.t===t.id&&last.r===t.rounds.length-1?' new':''}${bld?' bwc':''}" style="--d:${tw(t.rounds.length)+(t.rounds.length-1)*FW+750}ms">🏆 Champion: ${esc(pn(t,f.w))}</div>`;
 const out=new Set();t.rounds&&t.rounds.forEach(r=>r.forEach(m=>{if(m.w)out.add(m.a===m.w?m.b:m.a)}));
 h+=`<div class="panel"><h3 style="margin:0">Players (${t.players.length}${t.max?'/'+t.max:''})</h3><div class="plist">
 ${t.players.map(p=>`<span class="chip ${f&&f.w===p.id?'w':''}" ${out.has(p.id)?'style="opacity:.5"':''}>${esc(p.name)}${mgr&&!t.rounds?`<b onclick="removePlayer('${p.id}')">✕</b>`:''}</span>`).join('')||'<span class="mute">No players yet.</span>'}</div>
 ${mgr&&!t.rounds?`<div class="row" style="margin-top:14px"><input id="np" style="flex:1;min-width:160px;width:auto" placeholder="Add players (separate several with commas)" onkeydown="if(event.key==='Enter')addPlayers()"><button class="btn p" onclick="addPlayers()">Add</button></div>`:''}</div>`;
 if(!t.rounds)h+=signPanel(t);if(t.rounds)h+=`<div class="panel"><h3 style="margin-top:0">Bracket</h3>${mgr?'<div class="mute" style="margin-bottom:10px">Click a match to record each game. First to 5 wins.</div>':''}${flow(t)}</div>`;
 return h}
const signPanel=t=>{const full=t.max&&t.players.length>=t.max;return `<div class="panel"><h3 style="margin:0">Sign up</h3>${full?'<div class="mute" style="margin-top:6px">This tournament is full.</div>':`<div class="mute" style="margin:6px 0 10px">Enter your Minecraft IGN to join. Slots are limited, so be fast!</div><div class="row"><input id="sg" maxlength="16" placeholder="Your IGN" style="flex:1;min-width:160px;width:auto" value="${esc(localStorage[NS+'ign']||'')}" onkeydown="if(event.key==='Enter')joinT('${t.id}')"><button class="btn p" onclick="joinT('${t.id}')">Sign up</button></div>`}</div>`};
async function joinT(id){const t=D.tournaments.find(x=>x.id===id),n=$('#sg').value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(n))return toast('Enter a valid IGN (3–16 letters, numbers or _)');if(t.rounds)return toast('Registration is closed');if(t.max&&t.players.length>=t.max)return toast('This tournament is full');if(t.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))return toast('You’re already signed up');
 try{const F=await import('../fb.js');await F.signUp(id,n);localStorage[NS+'ign']=n;t.players.push({id:'s'+n.toLowerCase(),name:n});render();toast('✅ You’re in, '+n+'!',5000)}catch(e){toast(e.message||'Could not sign up',6000)}}
function render(){document.documentElement.classList.toggle('isMgr',mgr);$('#sign').textContent=mgr?'Sign out':'Manager sign in';$('#new').hidden=$('#set').hidden=!mgr;
 const t=cur();if(view&&!t)view=null;bld=!!(fx&&view&&t&&t.rounds);$('#app').className=fx?'enter':'';$('#app').innerHTML=view?detail(t):home();
 if(bld){const n=t.rounds.length,id=view;if(t.rounds[n-1][0].w)setTimeout(()=>{if(view===id)confetti()},tw(n)+(n-1)*FW+800)}
 fx=false;last=null;fit();requestAnimationFrame(fit)}
const nav=id=>{view=id;fx=true;render();scrollTo({top:0})};
const setFilter=k=>{filter=k;fx=true;render()};
/* manager actions */
function addPlayers(){const t=cur();for(const nm of $('#np').value.split(',').map(s=>s.trim()).filter(Boolean)){if(t.max&&t.players.length>=t.max){toast('Tournament is full');break}t.players.push({id:uid(),name:nm})}save();const e=$('#np');e&&e.focus()}
function removePlayer(id){const t=cur(),q=t.players.find(x=>x.id===id);if(q)t.rm=[...(t.rm||[]),q.name];t.players=t.players.filter(x=>x.id!==id);save()}
function startT(){const t=cur();if(t.players.length<2){toast('Add at least 2 players');return}start(t);fx=true;save()}
function resetT(){if(confirm('Reset the bracket? All results will be cleared.')){cur().rounds=null;save()}}
function delT(){if(confirm('Delete this tournament permanently?')){D.tournaments=D.tournaments.filter(x=>x.id!==view);view=null;save()}}
const closeModal=()=>{applyTheme(D.theme);const o=document.querySelector('.ov');if(!o)return;o.classList.add('out');setTimeout(()=>o.remove(),180);cm=null;if(pl&&view===pl.t){last=pl;const fin=pl.r===cur().rounds.length-1;pl=null;render();if(fin)confetti()}else pl=null};
const modal=h=>$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal">${h}</div></div>`;
function openForm(id){const t=D.tournaments.find(x=>x.id===id)||{};
 modal(`<h3 style="margin:0">${id?'Edit':'New'} tournament</h3>
 <label>Title<input id="f_title" value="${esc(t.title)}"></label><label>Server<input id="f_server" value="${esc(t.server)}"></label>
 <label>Reward<input id="f_prize" value="${esc(t.prize)}" placeholder="e.g. 10,000 coins + trophy"></label>
 <div class="row"><label style="flex:1">Max players<input id="f_max" type="number" min="2" value="${t.max||8}"></label><label style="flex:1">Date<input id="f_date" type="date" value="${esc(t.date)}"></label></div>
 <label>Description / rules<input id="f_desc" value="${esc(t.desc)}"></label>
 <div class="row"><div class="sp"></div><button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="saveForm('${id||''}')">Save</button></div>`)}
function saveForm(id){const v=k=>$('#f_'+k).value.trim();if(!v('title')){toast('Title is required');return}
 const d={title:v('title'),server:v('server'),prize:v('prize'),max:+v('max')||0,date:v('date'),desc:v('desc')};
 if(id)Object.assign(D.tournaments.find(x=>x.id===id),d);else D.tournaments.unshift({id:uid(),players:[],rounds:null,...d});closeModal();save()}
function settings(){pend={...D.theme};modal(`<h3 style="margin:0">Manager settings</h3>
 <b>Color theme</b><div class="sws">${Object.entries(THEMES).map(([k,v])=>`<button class="sw" data-k="${k}" title="${v[2]}" style="--a:${v[0]};--b:${v[1]}" onclick="pickTheme('${k}')"></button>`).join('')}</div>
 <div class="seg">${['auto','light','dark'].map(m=>`<button data-m="${m}" onclick="pickMode('${m}')">${m[0].toUpperCase()+m.slice(1)}</button>`).join('')}</div>
 <hr style="width:100%;border:0;border-top:1px solid var(--line)"><b>Publishing</b>
 <label>GitHub token (needed to publish changes)<input id="s_tk" type="password" value="${esc(localStorage[NS+'tk']||'')}" placeholder="github_pat_…"></label>
 <label>Repository (owner/name)<input id="s_repo" value="${esc(repo())}"></label>
 <hr style="width:100%;border:0;border-top:1px solid var(--line)"><b>Change password</b>
 <label>Current password<input id="s_cur" type="password"></label><label>New password<input id="s_new" type="password"></label><label>Confirm new password<input id="s_new2" type="password"></label>
 <div class="row"><div class="sp"></div><button class="btn" onclick="testConn()">Test connection</button><button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="saveSettings()">Save</button></div>`);markTheme()}
function markTheme(){document.querySelectorAll('.sw').forEach(e=>e.classList.toggle('on',e.dataset.k===pend.accent));document.querySelectorAll('.seg button').forEach(e=>e.classList.toggle('on',e.dataset.m===pend.mode))}
const pickTheme=k=>{pend.accent=k;applyTheme(pend);markTheme()},pickMode=m=>{pend.mode=m;applyTheme(pend);markTheme()};
async function saveSettings(){localStorage[NS+'tk']=$('#s_tk').value.trim();localStorage[NS+'repo']=$('#s_repo').value.trim();const n=$('#s_new').value;
 if(n){if(await sha($('#s_cur').value)!==D.pwHash){toast('Current password is wrong');return}
  if(n.length<6||n!==$('#s_new2').value){toast('New passwords must match (6+ characters)');return}}
 const th=JSON.stringify(D.theme)!==JSON.stringify(pend);
 if(n)D.pwHash=await sha(n);D.theme={...pend};closeModal();if(n||th)save();toast(n?'Password changed':'Settings saved')}
$('#new').onclick=()=>openForm('');$('#set').onclick=settings;
$('#sign').onclick=()=>{if(mgr){mgr=false;sessionStorage[NS+'mgr']='0';render();return}
 modal(`<h3 style="margin:0">Manager sign in</h3><label>Password<input id="pw" type="password" onkeydown="if(event.key==='Enter')login()"></label>
 <div class="row"><div class="sp"></div><button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="login()">Sign in</button></div>`);$('#pw').focus()};
async function login(){if(await sha($('#pw').value)!==D.pwHash){toast('Wrong password');return}
 mgr=true;sessionStorage[NS+'mgr']='1';closeModal();render();if(!localStorage[NS+'tk'])toast('Open ⚙ Settings once to add your GitHub token')}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.tab');if(!b)return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,x=document.createElement('span');x.className='rip';x.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(x);setTimeout(()=>x.remove(),600)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const cs=getComputedStyle(document.documentElement),c=[cs.getPropertyValue('--acc'),cs.getPropertyValue('--acc2'),'#ffd45e','#12a36b'];for(let i=0;i<40;i++){const d=document.createElement('i');d.className='cf';d.style.cssText=`left:${Math.random()*100}vw;background:${c[i%4]};--x:${(Math.random()-.5)*240}px;animation-delay:${Math.random()*.3}s;animation-duration:${1.3+Math.random()}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}}
try{applyTheme(JSON.parse(localStorage[NS+'th']))}catch(e){}
async function mergeSignups(){try{const F=await import('../fb.js'),su=(await F.signups()).sort((a,b)=>a.ts-b.ts);D.tournaments.forEach(t=>{if(t.rounds)return;const rm=(t.rm||[]).map(x=>x.toLowerCase()),have=new Set(t.players.map(p=>p.name.toLowerCase()));su.forEach(s=>{const k=s.ign.toLowerCase();if(s.tid===t.id&&!have.has(k)&&!rm.includes(k)&&(!t.max||t.players.length<t.max)){t.players.push({id:'s'+k,name:s.ign});have.add(k)}})})}catch(e){}}
load().then(mergeSignups).finally(()=>{fx=true;render()});
setInterval(()=>{if(!mgr&&!document.hidden&&!$('#modal').innerHTML)load().then(mergeSignups).then(render)},120000);
</script>
</body>
</html>

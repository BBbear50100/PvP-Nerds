function anvil(){try{unlock();const t=AC.currentTime,h=t+.7,o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(1500,t);o.frequency.exponentialRampToValueAtTime(240,h);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.1,h-.05);g.gain.exponentialRampToValueAtTime(.0001,h);o.connect(g).connect(AC.destination);o.start(t);o.stop(h);
 [[330,.5],[882,.35],[1456,.3],[2310,.22],[3180,.15]].forEach(([fr,v],i)=>{const o2=AC.createOscillator(),g2=AC.createGain();o2.type=i%2?'triangle':'sine';o2.frequency.value=fr;g2.gain.setValueAtTime(v*.5,h);g2.gain.exponentialRampToValueAtTime(.0001,h+1.7-i*.25);o2.connect(g2).connect(AC.destination);o2.start(h);o2.stop(h+1.8)});
 const b=AC.createBuffer(1,AC.sampleRate*.09,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=AC.createBufferSource(),gn=AC.createGain();s.buffer=b;gn.gain.value=.6;s.connect(gn).connect(AC.destination);s.start(h)}catch(e){}}
/* views */
function go(t){const ids=['overall',...MODES.map(m=>m.id)];$('#app').style.setProperty('--dx',ids.indexOf(t)>=ids.indexOf(tab)?1:-1);tab=t;fx=true;render();scrollTo({top:0})}
const tile=(p,m,lg)=>{const e=E(p,m.id),t=F.tierOf(e);return `<div class="tl${lg?' lg':''}" style="--c:${TC[t]}" data-tip="${esc(m.name)}: ${t} · ${f2(e)} ELO"><i>${ic(m)}</i><b>${t}</b></div>`};
const WL=(p,m)=>{const r=p.rec||{},x=m?[r[m]||{}]:Object.values(r);return {w:x.reduce((s,y)=>s+(y.w||0),0),l:x.reduce((s,y)=>s+(y.l||0),0)}};
const wr=(p,m)=>{const {w,l}=WL(p,m),t=w+l;return t?`<b>${Math.round(w/t*100)}%</b><small>${w}W · ${l}L</small>`:'<span class="nd">No data yet</span>'};
const wrt=(p,m)=>{const {w,l}=WL(p,m),t=w+l;return t?`${Math.round(w/t*100)}% (${w}W–${l}L)`:'No ELO tests yet'};
function rw(p,i,m){const r=rk(p),e=m?E(p,m.id):0,t=m?F.tierOf(e):'';return `<div class="rw r${i+1}" style="--i:${Math.min(i,24)};--tw:${m?80:Math.min(MODES.length,8)*53}px" onclick="prof('${p.id}')"><div class="rb">${i+1}</div>${av(p.name,'av')}<div class="nmb"><div class="nm">${esc(p.name)}</div><div class="sub" style="color:${r.c}">${r.t}</div></div><div class="rgw">${rg(p)}</div><div class="wrw">${wr(p,m&&m.id)}</div><span class="eln" style="--c:${m?TC[t]:'var(--acc)'}">${f2(m?e:ovr(p))}</span><div class="tiles">${m?tile(p,m,1):MODES.map(x=>tile(p,x)).join('')}</div></div>`}
const lh=m=>`<div class="lh" style="--tw:${m?80:Math.min(MODES.length,8)*53}px"><span class="h1">Rank</span><span class="h2">Player</span><span class="h3">Region</span><span class="h4">Win Rate</span><span class="h5">ELO</span><span class="h6">${m?'Tier':'Contributing Kits'}</span></div>`;
const head=(t,s)=>`<div class="top"><div><h1>${t}</h1><div class="mute">${s}</div></div><div class="sp"></div><button class="btn s" onclick="info()">ⓘ How ELO works</button></div>`;
function queueView(){const me=localStorage[NS+'ign']||'',ex=P.find(p=>p.name.toLowerCase()===me.toLowerCase()),reg=(ex&&ex.region)||localStorage[NS+'reg']||'',mp=MP[0],mq=QL.find(x=>me&&x.name.toLowerCase()===me.toLowerCase());
 let h=head(ic({icon:ICONS.queue})+' ELO Test Queue','Get matched with another player and duel for ELO.');
 if(mp){const o=mp.a.name.toLowerCase()===me.toLowerCase()?mp.b:mp.a,m=MODES.find(x=>x.id===mp.mode)||{name:mp.mode,icon:''};
  h+=`<div class="mt"><div class="lab">Match found</div><h2 style="margin:4px 0">${ic(m)} ${esc(m.name)} ELO test</h2><div class="vs2">${av(o.name,'pav')}<div style="text-align:left"><div class="mute">Your opponent</div><div style="font-size:30px;font-weight:900">${esc(o.name)}</div></div></div><ol class="stp"><li>Find <b>${esc(o.name)}</b> in game and play your duel.</li><li><b>Both players</b> must record the fight.</li><li>Send the recordings in <b>#Fight-Proof</b>.</li><li>Once an admin validates it, your ELO updates automatically.</li></ol></div>`}
 else if(mq){const m=MODES.find(x=>x.id===mq.mode)||{name:mq.mode};h+=`<div class="mt"><div class="radar"><i></i><i></i><i></i></div><h2 style="margin:0">Searching for a ${esc(m.name)} opponent…</h2><p class="mute">Keep this page open. You’ll hear an anvil drop when you’re matched.</p><button class="btn d" onclick="F.leaveQueue('${esc(me)}')">Leave queue</button></div>`}
 else h+=`<div class="panel"><div class="qf"><label class="mute">Minecraft IGN<input id="qi" maxlength="16" value="${esc(me)}" placeholder="Your IGN"></label><label class="mute">Region<select id="qr" style="width:100%;padding:10px 12px"><option value="">Select your region…</option>${REG.map(x=>`<option value="${x}" ${reg===x?'selected':''}>${RL[x]}</option>`).join('')}</select></label></div><div class="mute" style="margin-top:12px">Choose a gamemode</div><div class="qmg">${MODES.map(m=>`<div class="qm ${qm===m.id?'on':''}" onclick="qm='${m.id}';bd()"><i>${ic(m)}</i>${esc(m.name)}<small>${QL.filter(x=>x.mode===m.id).length} waiting</small></div>`).join('')}</div><div class="row"><button class="btn p" onclick="joinQ()">Join queue</button><button class="btn s" onclick="anvil()">🔊 Test sound</button></div><div class="mute" style="margin-top:10px">Your opponent only sees your IGN. You can duel the same player in the same gamemode up to 10 times every 12 hours.</div></div>`;
 return h}
function mgrView(){const lg=d=>LOG.filter(x=>!!x.done===d).map(x=>`<label class="lgr"><input type="checkbox" ${d?'checked':''} onchange="F.setDone('${x.id}',this.checked)"><span style="flex:1"><b>${esc(x.name)}</b> · ${x.type==='rank'?'Overall rank':esc((MODES.find(m=>m.id===x.mode)||{name:x.mode}).name)}: ${esc(x.from)} → <b>${esc(x.to)}</b></span><span class="mute">${new Date(x.ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span></label>`).join('')||'<div class="mute">Nothing here.</div>';
 const pr=PR.map(x=>{const m=MODES.find(y=>y.id===x.mode)||{name:x.mode,icon:''};return `<div class="lgr" style="flex-wrap:wrap"><span>${ic(m)} <b>${esc(m.name)}</b></span><span style="flex:1;min-width:140px"><b>${esc(x.a.name)}</b> <span class="mute">vs</span> <b>${esc(x.b.name)}</b></span><button class="btn s p" onclick="rec('${x.id}',1)">${esc(x.a.name)} won</button><button class="btn s p" onclick="rec('${x.id}',0)">${esc(x.b.name)} won</button><button class="btn s d" onclick="F.delPair('${x.id}')">Cancel</button></div>`}).join('')||'<div class="mute">No matched tests waiting.</div>';
 return `<div class="top"><div><h1>🔒 Manager</h1><div class="mute">Only visible while you’re signed in.</div></div><div class="sp"></div><button class="btn s" onclick="gm()">Edit gamemodes</button></div>
 <div class="panel"><h3 style="margin:0 0 8px">Matched ELO tests · validate the winner</h3>${pr}</div>
 <div class="panel"><h3 style="margin:0 0 8px">Record a result manually</h3><div class="row"><select id="mm">${MODES.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><input id="ma" list="pl" placeholder="Player A" style="flex:1;min-width:130px"><input id="mb" list="pl" placeholder="Player B" style="flex:1;min-width:130px"><select id="mw"><option value="a">A won</option><option value="b">B won</option></select><button class="btn p" onclick="recM()">Record</button></div><datalist id="pl">${P.map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist></div>
 <div class="panel"><h3 style="margin:0 0 8px">Appearance</h3><div class="row"><label class="mute">Tier 1 color<input type="color" id="c1" value="${TH_.t1}" oninput="prevLook()"></label><label class="mute">Tier 2 color<input type="color" id="c2" value="${TH_.t2}" oninput="prevLook()"></label><label class="mute">Tier 3 color<input type="color" id="c3" value="${TH_.t3}" oninput="prevLook()"></label><label class="mute">Overall icon<input id="io" value="${esc(ICONS.overall)}" style="width:90px"></label><label class="mute">ELO Test icon<input id="iq" value="${esc(ICONS.queue)}" style="width:90px"></label><button class="btn p" onclick="saveLook()">Save</button></div><div class="mute" style="margin-top:8px">Each color sets LT; MT and HT are brighter shades of it.</div><div id="lkp" style="margin-top:10px;line-height:2.3"></div></div>
 <div class="panel"><h3 style="margin:0 0 8px">To update on Discord (${LOG.filter(x=>!x.done).length})</h3>${lg(false)}</div><div class="panel"><h3 style="margin:0 0 8px">Already updated on Discord</h3>${lg(true)}</div>`}
function bd(){const f=q.trim().toLowerCase(),m=MODES.find(x=>x.id===tab),ok=p=>!f||p.name.toLowerCase().includes(f);let h='';
 if(tab==='queue')h=queueView();else if(tab==='mgr'&&isM())h=mgrView();
 else if(m){const l=[...P].sort((a,b)=>E(b,m.id)-E(a,m.id)||a.name.localeCompare(b.name));h=head(`${ic(m)} ${esc(m.name)} Tier List`,`${l.length} players · ranked by ELO`)+lh(m);let last=0,b='';l.forEach((p,i)=>{if(!ok(p))return;const n=tn(F.tierOf(E(p,m.id)));if(n!==last){last=n;b+=`<div class="sec">Tier ${n}</div>`}b+=rw(p,i,m)});h+=b||'<div class="empty">No players yet. Queue for an ELO test to get on the list!</div>'}
 else{const l=sorted();h=head(ic({icon:ICONS.overall})+' Overall Rankings','Overall ELO = total ELO across all gamemodes ÷ 2')+lh();h+=l.map((p,i)=>ok(p)?rw(p,i):'').join('')||'<div class="empty">No players yet. Queue for an ELO test to get on the list!</div>'}
 $('#app').className=fx?'enter':'';$('#app').innerHTML=h;fx=false;if($('#lkp'))prevLook()}
function live(){if(tab==='queue'||tab==='mgr'){const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&$('#app').contains(a))return}bd()}
function render(){$('#logo').innerHTML='<i>🏆</i><span class="lt">PvP Nerd Tiers</span>';
 $('#tabs').innerHTML=[{id:'overall',name:'Overall',icon:ICONS.overall},...MODES,{id:'queue',name:'ELO Test',icon:ICONS.queue},...(isM()?[{id:'mgr',name:'Manager',icon:'🔒'}]:[])].map(m=>`<button class="tab ${tab===m.id?'on':''}${fx&&tab===m.id?' pop':''}" onclick="go('${m.id}')"><i>${ic(m)}</i>${esc(m.name)}</button>`).join('');bd()}
/* profile + info */
function prof(id){const p=P.find(x=>x.id===id);if(!p)return;const r=rk(p),pos=sorted().findIndex(x=>x.id===id)+1;
 modal(`<div class="ban" style="--c:${r.c}">${av(p.name,'pav')}<div class="pi"><h2>${esc(p.name)}</h2><div class="rkt" style="color:${r.c}">${r.t}</div><div class="chips"><span class="chip">Overall #${pos}</span><span class="chip"><b>${f2(ovr(p))}</b> overall ELO</span><span class="chip">Win rate <b>${wrt(p)}</b></span>${rg(p)}</div></div><canvas class="body" id="sk" width="300" height="300"></canvas></div>
 <div class="pg">${MODES.map((m,i)=>{const e=E(p,m.id),t=F.tierOf(e);return `<div class="mc" style="--c:${TC[t]};--i:${i}"><span class="mi2">${ic(m)}</span><div class="mn">${esc(m.name)}</div><b class="tt">${t}</b><span class="pp">${f2(e)} ELO</span><span class="pp">${WL(p,m.id).w+WL(p,m.id).l?wrt(p,m.id):'No data yet'}</span></div>`}).join('')}</div>
 <div class="row">${isM()?`<button class="btn s d" onclick="delP('${id}')">Delete player</button>`:''}<div class="sp"></div><button class="btn p" onclick="closeModal()">Done</button></div>`,'wide');skin(p.name)}
let skv;const loadSkv=()=>skv||(skv=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/skinview3d@3.0.1/bundles/skinview3d.bundle.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)}));
async function skin(n){const fb=()=>{const e=$('#sk');if(e)e.outerHTML=`<img class="body" alt="" src="https://mc-heads.net/avatar/${encodeURIComponent(n)}/170">`};
 try{await loadSkv();const c=$('#sk');if(!c)return;const v=new skinview3d.SkinViewer({canvas:c,width:300,height:300});SKV=v;v.animation=null;v.zoom=1.55;v.fov=28;v.autoRotate=false;v.controls.enableZoom=false;v.controls.enablePan=false;v.controls.enableRotate=false;
  await v.loadSkin('https://mc-heads.net/skin/'+encodeURIComponent(n));const k=v.playerObject.skin;v.playerObject.position.y=-9;v.playerObject.rotation.y=-.25;k.head.rotation.set(0,.15,-.05);k.rightArm.rotation.set(0,0,-.12);
  (function wave(t){if(SKV!==v)return;k.leftArm.rotation.set(0,0,2.55+.32*Math.sin(t/130));k.head.rotation.z=-.05+.04*Math.sin(t/260);requestAnimationFrame(wave)})(0)}catch(e){fb()}}
function info(){const row=(a,b,c)=>`<div><b style="color:${c}">${a}</b> · ${b}</div>`;
 modal(`<h3>How ELO works</h3><div class="ti"><div>Everyone starts at <b>10.00 ELO</b> in every gamemode. Win an ELO test to gain ELO, lose and you drop. Your tier in each gamemode comes from your ELO there.</div></div><h3>Combat ranks · overall ELO</h3><div class="ti">${[['Rookie','0–100'],['Trainee','100–160'],['Novice','160–220'],['Ace','220–280'],['Master','280–400'],['Grandmaster','400+']].map(([n,r])=>row(n,r,RC['Combat '+n])).join('')}</div><h3>Tiers · gamemode ELO</h3><div class="ti">${F.TN.map((t,i)=>row(t,F.TH[i]+(F.TH[i+1]!=null?'–'+F.TH[i+1]:'+'),TC[t])).join('')}</div><h3>ELO tests</h3><div class="ti"><div>Both players must record the fight and send the proof in #Fight-Proof. An admin validates the result. The same two players can duel up to 10 times per gamemode every 12 hours.</div></div><div class="row"><div class="sp"></div><button class="btn p" onclick="closeModal()">Close</button></div>`)}
/* queue + manager actions */
function watchMine(){if(unsub)unsub();unsub=null;const me=localStorage[NS+'ign']||'';MP=[];if(!IGN.test(me))return;
 unsub=F.watchPairs(me,(l,added)=>{MP=l;if(added.some(x=>Date.now()-x.ts<18e4)){anvil();tab='queue';fx=true;render()}else live()})}
async function joinQ(){const n=$('#qi').value.trim();if(!IGN.test(n))return toast('Enter a valid IGN (3–16 letters, numbers or _)');if(!qm)return toast('Pick a gamemode');const rg0=$('#qr').value;if(!rg0)return toast('Pick your region');localStorage[NS+'reg']=rg0;
 localStorage[NS+'ign']=n;unlock();try{const r=await F.joinQueue(n,qm,rg0);watchMine();toast(r.matched?'Match found!':r.skipped.length?'Waiting for another opponent (you’ve hit the 12-hour limit with '+r.skipped.join(', ')+' in this gamemode)':'You’re in the queue!',6000)}catch(e){toast('Could not join: '+e.message,6000)}}
const look=()=>({t1:$('#c1').value,t2:$('#c2').value,t3:$('#c3').value});
function prevLook(){const tc=buildTC(look());$('#lkp').innerHTML=['1','2','3'].map(n=>['LT','MT','HT'].map(x=>`<span class="bd" style="--c:${tc[x+n]};font-size:14px;padding:4px 14px;margin-right:6px">${x+n}</span>`).join('')).join('<br>')}
async function saveLook(){TH_=look();TC=buildTC(TH_);ICONS={overall:$('#io').value.trim()||'🏆',queue:$('#iq').value.trim()||'⚔️'};try{await F.saveCfg('look',{theme:TH_,icons:ICONS});render();toast('Appearance saved ✓')}catch(e){toast('Could not save: '+e.message,6000)}}
const res=(r,a,b)=>`${a} ${f2(r.ea)}→${f2(r.na)} · ${b} ${f2(r.eb)}→${f2(r.nb)}`;
async function rec(id,aw){const x=PR.find(y=>y.id===id);if(!x)return;try{const r=await F.record(x.mode,x.a.name,x.b.name,aw?x.a.name:x.b.name,MODES.map(m=>m.id),id);toast('Recorded · '+res(r,x.a.name,x.b.name),8000)}catch(e){toast('Could not record: '+e.message,7000)}}
async function recM(){const a=$('#ma').value.trim(),b=$('#mb').value.trim();if(!IGN.test(a)||!IGN.test(b))return toast('Enter two valid IGNs');try{const r=await F.record($('#mm').value,a,b,$('#mw').value==='a'?a:b,MODES.map(m=>m.id));toast('Recorded · '+res(r,a,b),8000)}catch(e){toast('Could not record: '+e.message,7000)}}
function delP(id){const p=P.find(x=>x.id===id);if(confirm('Delete '+p.name+' and all their ELO?')){F.delPlayer(id);closeModal()}}
const gmRows=()=>_gm.map((m,i)=>`<div class="mrow"><input value="${esc(m.name)}" oninput="_gm[${i}].name=this.value"><input value="${esc(m.icon)}" oninput="_gm[${i}].icon=this.value" style="max-width:110px;min-width:80px"><button class="btn s d" onclick="_gm.splice(${i},1);$('#gml').innerHTML=gmRows()">✕</button></div>`).join('');
function gm(){_gm=MODES.map(m=>({...m}));modal(`<h3>Gamemodes</h3><div id="gml" style="display:grid;gap:8px">${gmRows()}</div><div class="row"><button class="btn s" onclick="_gm.push({id:'m'+Math.random().toString(36).slice(2,6),name:'New gamemode',icon:'⭐'});$('#gml').innerHTML=gmRows()">+ Add gamemode</button></div><div class="mute">Name, then an emoji or image link for the icon.</div><div class="row"><div class="sp"></div><button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="gmSave()">Save</button></div>`)}
async function gmSave(){const l=_gm.filter(m=>m.name.trim()).map(m=>({id:m.id,name:m.name.trim(),icon:m.icon.trim()||'⭐'}));if(!l.length)return toast('Keep at least one gamemode');try{await F.saveModes(l);MODES=l;closeModal();render();toast('Gamemodes saved ✓')}catch(e){toast('Could not save: '+e.message,6000)}}
(async()=>{F=await import('../fb.js');adm=!!(await F.user());try{const l=await F.getModes();if(l&&l.length)MODES=l}catch(e){}try{const lk=await F.getCfg('look');if(lk){TH_={...TH_,...(lk.theme||{})};TC=buildTC(TH_);ICONS={...ICONS,...(lk.icons||{})}}}catch(e){}
 F.watchPlayers(l=>{P=l;live()});F.watchQueue(l=>{QL=l;live()});watchMine();
 if(isM()){F.watchPairs('',l=>{PR=l;live()});F.watchLog(l=>{LOG=l;live()})}
 render()})().catch(e=>{console.error(e);$('#app').innerHTML='<div class="empty">Could not load the tier list.<br><small>'+esc(F&&!F.user?'fb.js on your site is out of date (re-upload it)':(e&&e.message)||e)+'</small></div>'});
</script></body></html>

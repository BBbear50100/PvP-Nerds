<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PvP Warmup</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--pan:#111729;--row:#141b30;--line:#222c48;--ink:#eef1fb;--mute:#8791b0;--acc:#ffc24a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 520px at 12% -6%,#1d2a5a77,transparent),radial-gradient(800px 520px at 92% 0,#5a1d6a44,transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit;color:inherit}header{position:sticky;top:0;z-index:5;background:#080b14c8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:12px 20px;display:flex;gap:10px;align-items:center}.logo{font-weight:900;font-size:20px;letter-spacing:.05em;color:var(--acc)}.sp{flex:1}
main{max-width:1100px;margin:auto;padding:24px 20px 60px}h1{margin:0 0 4px;font-size:30px}.mute{color:var(--mute);font-size:13px}
.btn{border:1px solid var(--line);background:var(--pan);padding:9px 18px;border-radius:12px;cursor:pointer;font-weight:700;transition:.15s}.btn:hover{transform:translateY(-2px);background:#1b2440;box-shadow:0 8px 20px #0006}.btn:active{transform:scale(.95)}.btn.p{background:linear-gradient(135deg,#ffc24a,#ff8a3d);color:#2a1500;border:0}.btn.s{padding:4px 10px;font-size:13px}.btn.d{color:#ff6b6b}.btn.big{font-size:20px;padding:14px 44px}
input{background:#0a0f1d;border:1px solid var(--line);border-radius:11px;padding:10px 13px;width:100%;transition:.2s}input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #ffc24a30}
.pg{animation:up .5s}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin:18px 0}.panel{background:#111729cc;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;animation:up .5s backwards}.two .panel:nth-child(2){animation-delay:.1s}.panel h3{margin:0 0 10px}
.lr{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--row);border-radius:12px;margin-top:8px;animation:up .5s backwards;transition:.2s}.lr:hover{transform:translateX(4px);background:#1b2440}.lr img{width:42px;height:42px;border-radius:50%;border:2px solid var(--acc);image-rendering:pixelated}.lr .n{flex:1;font-weight:800}.lr b.v{color:var(--acc);font-size:18px}.md{font-size:24px}.fl{display:inline-block;animation:fl 1s ease-in-out infinite alternate}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:180px}
.stage{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:radial-gradient(900px 600px at 50% 0,#1d2a5a88,transparent),#080b14;animation:fin .35s}
.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px 70px 0}.steps span{padding:6px 14px;border-radius:99px;background:#ffffff10;color:var(--mute);font-weight:700;font-size:13px;transition:.3s}.steps .now{background:linear-gradient(135deg,#ffc24a,#ff8a3d);color:#2a1500;box-shadow:0 0 20px #ffc24a55;transform:scale(1.08)}.steps .done{color:#5eed95}
.q{position:absolute;top:12px;right:14px}.sb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px 24px;text-align:center;animation:up .45s}
.pad{position:relative;overflow:hidden;width:100%;max-width:1000px;min-height:58vh;border-radius:24px;display:grid;place-items:center;font-size:26px;font-weight:900;letter-spacing:.04em;user-select:none;cursor:pointer;background:linear-gradient(#1a2340,#121a30);border:2px solid #3a4a7c;transition:background .25s,border-color .25s,transform .1s}.pad:active{transform:scale(.985)}.pad b{font-size:min(22vw,150px);display:block;color:var(--acc);line-height:1.1}.pad b.bump{animation:bump .15s}
.pad.wait{background:linear-gradient(#6b1c1c,#451010);border-color:#c44}.pad.go{background:linear-gradient(#17803f,#0e5a2a);border-color:#4f4;animation:pulse .5s infinite alternate}.pad.early{background:linear-gradient(#7a5410,#4d3308);border-color:#eb4}.pad.res{background:linear-gradient(#1d4f9a,#12336a);border-color:#6af}.pad.res b{animation:pop .4s}
.rp{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;opacity:.5;transform:translate(-50%,-50%) scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
.tb{width:100%;max-width:1000px;height:8px;border-radius:9px;background:#ffffff14;overflow:hidden}.tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffc24a,#ff5d73)}
.cd{font-size:160px;font-weight:900;color:var(--acc);animation:pop .65s}.breath{position:relative;width:180px;height:180px;display:grid;place-items:center;font-weight:700}.breath i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(#5eed9555,#3b82f622 70%);border:2px solid #5eed9588;animation:br 5s ease-in-out}
.key{font-size:min(30vw,200px);font-weight:900;line-height:1;background:linear-gradient(#1c2650,#121a30);border:3px solid var(--acc);border-radius:30px;padding:14px 60px;color:var(--acc);box-shadow:0 0 50px #ffc24a22}.key.in{animation:keyIn .3s cubic-bezier(.3,1.6,.5,1)}.key.bad{border-color:#f55;color:#f55;animation:sh .25s}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.dots span{min-width:36px;padding:5px 9px;border-radius:9px;background:#ffffff10;font-weight:800;color:var(--mute);transition:.2s}.dots .ok{background:#17803f55;color:#7dffb0}.dots .cur{background:var(--acc);color:#2a1500;transform:scale(1.15)}
.arena{position:relative;width:100%;max-width:1200px;height:66vh;background:#0a0f1d;border-radius:20px;border:1px solid var(--line);overflow:hidden;cursor:crosshair}.tg{position:absolute;border-radius:50%;background:radial-gradient(#fff 0 12%,#ff4d4d 14% 40%,#fff 42% 55%,#ff4d4d 57%);cursor:crosshair;animation:tgIn .18s cubic-bezier(.3,1.6,.5,1)}.bs{position:absolute;border-radius:50%;border:3px solid var(--acc);animation:bs .5s ease-out forwards;pointer-events:none}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;width:100%;max-width:1000px}.sc{background:linear-gradient(#171f38,#10162a);border:1px solid var(--line);border-radius:16px;padding:18px;animation:up .55s backwards}.sc b{display:block;font-size:34px;color:var(--acc)}
.ov{position:fixed;inset:0;background:#03050bcc;display:grid;place-items:center;padding:16px;z-index:60;animation:fin .2s}.modal{background:#121a30;border:1px solid var(--line);border-radius:18px;padding:22px;width:min(420px,100%);display:grid;gap:12px;animation:up .3s}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;width:max-content;max-width:92vw}.t{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;animation:up .3s}
table{width:100%;border-collapse:collapse}td{padding:5px}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes fin{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.4)}}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes bump{50%{transform:scale(1.18)}}@keyframes pulse{to{box-shadow:0 0 60px #4f48}}@keyframes rp{to{transform:translate(-50%,-50%) scale(18);opacity:0}}@keyframes br{0%,100%{transform:scale(.55)}50%{transform:scale(1)}}
@keyframes keyIn{from{transform:scale(.6) rotate(-6deg);opacity:.2}}@keyframes tgIn{from{transform:scale(0)}}@keyframes bs{to{transform:scale(2.4);opacity:0}}@keyframes fl{to{transform:scale(1.25) rotate(8deg)}}
.emb header{display:none}@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<header><div class="bar"><div class="logo">🎯 PvP WARMUP</div><div class="sp"></div><button class="btn s" id="lg" onclick="mlogin()">Manager login</button></div></header>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const NS=(location.pathname.split('/')[1]||'root')+':';if(top!==self)document.documentElement.classList.add('emb');
const DP=(a=>a.slice(2,-1).length?a.slice(2,-1).join('/')+'/data.json':'data.json')(location.pathname.split('/'));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let D={mgr:'',players:[]},mg=top!==self?sessionStorage[NS+'sm']==='1':sessionStorage[NS+'wm']==='1',API='';const DEFK=['1','2','3','4','5','r','c','q','v'];
function toast(m,ms=3500){$('#toast').innerHTML='<div class="t">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',ms)}
function repo(){if(localStorage[NS+'repo'])return localStorage[NS+'repo'];const h=location.hostname;if(!h.endsWith('github.io'))return'';let s=location.pathname.split('/')[1];if(!s||s.endsWith('.html'))s=h;return h.split('.')[0]+'/'+s}
async function fresh(p,rel){const r=repo();if(r){try{const x=await fetch(`https://api.github.com/repos/${r}/contents/${p}`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(x.ok)return await x.json()}catch(e){}}try{return await(await fetch(rel+'?'+Date.now())).json()}catch(e){return null}}
async function load(){const d=await fresh(DP,'data.json'),c=await fresh('site.json','../site.json');if(d)D={mgr:d.mgr,players:d.players||[]};API=(c&&c.signupUrl)||''}
async function push(){const tk=(localStorage[NS+'tk']||'').replace(/[\s"']/g,''),r=repo();if(!tk||!r){toast('Add your GitHub token and repo first',6000);return}
 const u=`https://api.github.com/repos/${r}/contents/${DP}`,h={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
 try{for(let a=0;a<3;a++){const g=await fetch(u+'?t='+Date.now(),{headers:h,cache:'no-store'}),j=g.ok?await g.json():null,b={message:'Update warmup',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1))))};if(j&&j.sha)b.sha=j.sha;
  const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(b)});if(p.ok){toast('Saved ✓');return}if(p.status!==409&&p.status!==422){toast('GitHub refused ('+p.status+'). Check token and repo.',8000);return}await new Promise(z=>setTimeout(z,700))}}catch(e){toast('Network error: '+e.message,8000)}}
/* stats */
const day=t=>new Date(t).toISOString().slice(0,10),DAY=864e5;
function streak(p){const d=p.days||{};let c=d[day(Date.now())]?Date.now():Date.now()-DAY,n=0;while(d[day(c)]){n++;c-=DAY}return n}
function sharp(p){const v=Object.keys(p.days||{}).sort().slice(-7).map(k=>p.days[k].score);return v.length?Math.round(v.reduce((a,b)=>a+b)/v.length):0}
const find=n=>D.players.find(p=>p.name.toLowerCase()===n.toLowerCase());
const av=n=>`<img alt="" src="https://mc-heads.net/avatar/${encodeURIComponent(n)}/64" onerror="this.style.visibility='hidden'">`;
function top3(fn,val,sub){const l=D.players.map(p=>({p,v:fn(p)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);return l.map((x,i)=>`<div class="lr" style="animation-delay:${i*80}ms"><span class="md">${['🥇','🥈','🥉'][i]}</span>${av(x.p.name)}<span class="n">${esc(x.p.name)}<div class="mute">${sub(x.p)}</div></span><b class="v">${val(x.v)}</b></div>`).join('')||'<div class="mute">No warmups logged yet. Be the first!</div>'}
const last=p=>{const k=Object.keys(p.days||{}).sort().pop();return k?p.days[k]:null};
function home(){$('#app').innerHTML=`<div class="pg"><h1>Daily Warmup</h1><div class="mute">Left click → right click → hotkeys → aim → reaction. Do it every day to build your streak.</div>
<div class="two"><div class="panel"><h3>🔥 Top streaks</h3>${top3(streak,v=>'<span class="fl">🔥</span> '+v+' day'+(v>1?'s':''),p=>{const l=last(p);return l?`${l.cps} CPS · ${l.react}ms reaction`:''})}</div><div class="panel"><h3>⚡ Sharpest warmuppers</h3>${top3(sharp,v=>v+' pts',p=>{const l=last(p);return l?`${l.hk}ms hotkeys · ${l.flick}ms flicks`:''})}</div></div>
<div class="panel"><h3>Start your warmup</h3><div class="row"><input id="ign" maxlength="16" placeholder="Your IGN" value="${esc(localStorage[NS+'ign']||'')}" onkeydown="if(event.key==='Enter')begin()"><button class="btn p" onclick="begin()">Start warmup</button></div><div class="mute" style="margin-top:8px">One warmup per day counts toward your streak (your best score of the day is kept).</div></div>${mg?mgr():''}</div>`}
/* drills */
const NAMES=['Left click','Right click','Hotkeys','Aim','Reaction'];let si=0;
const stage=h=>{$('#app').innerHTML=`<div class="stage"><button class="btn s q" onclick="location.reload()">✕ Quit</button><div class="steps">${NAMES.map((n,i)=>`<span class="${i<si?'done':i===si?'now':''}">${n}</span>`).join('')}</div><div class="sb">${h}</div></div>`},wait=ms=>new Promise(r=>setTimeout(r,ms)),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function ripple(el,e){const r=el.getBoundingClientRect(),d=document.createElement('span');d.className='rp';d.style.left=e.clientX-r.left+'px';d.style.top=e.clientY-r.top+'px';el.appendChild(d);setTimeout(()=>d.remove(),600)}
function cu(el,to,dec){const t0=performance.now();(function f(n){const k=Math.min((n-t0)/900,1);el.textContent=(to*(1-Math.pow(1-k,3))).toFixed(dec)+(el.dataset.s||'');if(k<1)requestAnimationFrame(f)})(t0)}
async function pre(i,t,d){si=i;
 if(!i){stage(`<h1>${t}</h1><p class="mute">${d}</p><button class="btn p big" id="go">Start</button>`);await new Promise(r=>$('#go').onclick=r)}
 else{stage(`<div class="breath"><i></i><span id="bt">Breathe in…</span></div><div class="mute">Break time · next up</div><h1>${t}</h1><p class="mute">${d}</p><div class="mute"><b id="bc">5</b>s · <a href="#" id="sk" style="color:var(--acc)">skip</a></div>`);setTimeout(()=>$('#bt')&&($('#bt').textContent='Breathe out…'),2500);
  await new Promise(r=>{let n=5;const iv=setInterval(()=>{n--;$('#bc')&&($('#bc').textContent=n);if(n<=0){clearInterval(iv);r()}},1000);$('#sk').onclick=e=>{e.preventDefault();clearInterval(iv);r()}})}
 for(let k=3;k>0;k--){stage(`<div class="cd">${k}</div>`);await wait(650)}}
const cpsD=r=>new Promise(res=>{let n=0,t0=0,iv;stage(`<div class="tb"><i id="tbi"></i></div><div class="pad" id="pad"><div>${r?'RIGHT':'LEFT'} CLICK HERE<b id="cn">0</b><span class="mute" id="tm">Timer starts on your first click · 20s</span></div></div>`);const pad=$('#pad');pad.oncontextmenu=e=>e.preventDefault();
 pad.onmousedown=e=>{e.preventDefault();if(e.button!==(r?2:0))return;ripple(pad,e);if(!t0){t0=performance.now();iv=setInterval(()=>{const l=Math.max(20-(performance.now()-t0)/1000,0);$('#tm').textContent=l.toFixed(1)+'s';$('#tbi').style.width=l/20*100+'%';if(l<=0){clearInterval(iv);pad.onmousedown=null;res(n/20)}},40)}n++;const c=$('#cn');c.textContent=n;c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump')}});
const hkD=k=>new Promise(res=>{let i=0,t=performance.now(),ts=[];const tot=k.length*2;stage('<div class="mute" id="hc"></div><div class="key" id="ky"></div><div class="dots" id="dt"></div>');
 const draw=()=>{const e=$('#ky');e.textContent=k[i%k.length].toUpperCase();e.className='key';void e.offsetWidth;e.className='key in';$('#hc').textContent=`${i+1} / ${tot}`;$('#dt').innerHTML=k.map((x,j)=>`<span class="${j<i%k.length?'ok':j===i%k.length?'cur':''}">${esc(x.toUpperCase())}</span>`).join('')};draw();
 const on=e=>{e.preventDefault();if(e.key.toLowerCase()!==k[i%k.length].toLowerCase()){const y=$('#ky');y.classList.remove('bad','in');void y.offsetWidth;y.classList.add('bad');return}const n=performance.now();ts.push(n-t);t=n;i++;if(i>=tot){removeEventListener('keydown',on);res(avg(ts))}else draw()};addEventListener('keydown',on)});
const aimD=()=>new Promise(res=>{let n=0,ts=[];stage('<div class="mute" id="an">0 / 15</div><div class="arena" id="ar"></div>');const ar=$('#ar'),nx=()=>{ar.querySelectorAll('.tg').forEach(x=>x.remove());const s=60,d=document.createElement('div');d.className='tg';d.style.cssText=`left:${Math.random()*(ar.clientWidth-s)}px;top:${Math.random()*(ar.clientHeight-s)}px;width:${s}px;height:${s}px`;const t=performance.now();
 d.onmousedown=()=>{ts.push(performance.now()-t);n++;const b=document.createElement('div');b.className='bs';b.style.cssText=d.style.cssText;ar.appendChild(b);setTimeout(()=>b.remove(),500);$('#an').textContent=`${n} / 15 · avg ${Math.round(avg(ts))}ms`;n>=15?res(avg(ts)):nx()};ar.appendChild(d)};nx()});
async function reactD(){const ts=[];for(let i=0;i<5;i++)ts.push(await new Promise(res=>{stage('<div class="pad wait" id="rc"></div>');const el=$('#rc');let t0=0,to;const arm=()=>{t0=0;el.className='pad wait';el.innerHTML=`<div>Wait for green…<span class="mute" style="display:block">round ${i+1} / 5</span></div>`;to=setTimeout(()=>{el.className='pad go';el.textContent='CLICK!';t0=performance.now()},1000+Math.random()*3000)};arm();
 el.onmousedown=e=>{ripple(el,e);if(t0){const v=performance.now()-t0;el.onmousedown=null;el.className='pad res';el.innerHTML=`<div><b>${Math.round(v)}ms</b></div>`;setTimeout(()=>res(v),900)}else{clearTimeout(to);el.className='pad early';el.textContent='Too early! Wait for green…';to=setTimeout(arm,900)}}}));return avg(ts)}
async function begin(){const n=$('#ign').value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(n))return toast('Enter a valid IGN (3–16 letters, numbers or _)');localStorage[NS+'ign']=n;
 const p=find(n),keys=(p&&p.hotkeys&&p.hotkeys.length?p.hotkeys:DEFK);
 await pre(0,'Left click','Click as fast as you can for 20 seconds.');const L=await cpsD(0);
 await pre(1,'Right click','Same thing, with right click. 20 seconds.');const R=await cpsD(1);
 await pre(2,'Hotkeys','Press each key shown, in order. Your keys: '+keys.join(' ').toUpperCase()+' (two rounds).');const hk=await hkD(keys);
 await pre(3,'Aim','Click 15 targets as fast as you can.');const fl=await aimD();
 await pre(4,'Reaction','5 rounds. Click the moment the screen turns green.');const re=await reactD();
 const s={cps:+((L+R)/2).toFixed(1),hk:Math.round(hk),flick:Math.round(fl),react:Math.round(re)};s.score=Math.round(s.cps*6+12000/s.hk+20000/s.flick+10000/s.react);si=5;
 stage(`<h1>Warmup complete! 🎉</h1><div class="sg">${[[s.cps,'avg CPS',1,''],[s.hk,'hotkey speed',0,'ms'],[s.flick,'flick speed',0,'ms'],[s.react,'reaction time',0,'ms'],[s.score,'sharpness score',0,'']].map(([v,l,d,u],i)=>`<div class="sc" style="animation-delay:${i*120}ms"><b data-to="${v}" data-d="${d}" data-s="${u}">0</b>${l}</div>`).join('')}</div><div class="mute" id="sv">Saving…</div><button class="btn p big" onclick="load().then(boot)">Back to leaderboard</button>`);
 document.querySelectorAll('[data-to]').forEach(e=>cu(e,+e.dataset.to,+e.dataset.d));
 if(!API){$('#sv').textContent='Not saved: warmup saving isn’t connected yet (see README).';return}
 try{const r=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'warmup',ign:n,stats:s})})).json();$('#sv').textContent=r.error?'Not saved: '+r.error:'Saved ✓ Streak: '+(r.streak||1)+' day(s) 🔥'}catch(e){$('#sv').textContent='Could not reach the saving service.'}}
/* manager */
function modal(h){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)this.remove()"><div class="modal">${h}</div></div>`}
function mlogin(){if(mg){mg=false;sessionStorage[NS+'wm']='0';return boot()}modal(`<h3>Manager login</h3><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')mdo()"><div class="row"><button class="btn p" onclick="mdo()">Sign in</button></div>`);$('#pw').focus()}
async function mdo(){if(await sha($('#pw').value)!==D.mgr)return toast('Wrong password');mg=true;sessionStorage[NS+'wm']='1';$('#modal').innerHTML='';boot()}
function mgr(){return `<div class="panel"><h3>Manager: hotkeys</h3><div class="mute">Set each player’s hotkeys in order, separated by spaces (example: 1 x 3 4 5 r c q v). Players without hotkeys use: ${DEFK.join(' ')}.</div><table>${D.players.map((p,i)=>`<tr><td style="width:30%">${esc(p.name)}</td><td><input value="${esc((p.hotkeys||[]).join(' '))}" placeholder="default" oninput="D.players[${i}].hotkeys=this.value.trim().split(/\\s+/).filter(Boolean)"></td><td><button class="btn s d" onclick="delP(${i})">✕</button></td></tr>`).join('')}</table>
 <div class="row" style="margin-top:10px"><input id="np" placeholder="Add player IGN"><button class="btn s" onclick="addP()">Add</button></div>
 <div class="row" style="margin-top:14px"><input id="tk" type="password" placeholder="GitHub token" value="${esc(localStorage[NS+'tk']||'')}"><input id="rp" placeholder="owner/repo" value="${esc(repo())}"><button class="btn p" onclick="msave()">Save changes</button></div></div>`}
function addP(){const n=$('#np').value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(n)||find(n))return toast('Invalid or duplicate IGN');D.players.push({id:Math.random().toString(36).slice(2,9),name:n,hotkeys:[],days:{}});home()}
function delP(i){if(confirm('Remove '+D.players[i].name+' and their history?')){D.players.splice(i,1);home()}}

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PvP Warmup</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--pan:#111729;--row:#141b30;--line:#222c48;--ink:#eef1fb;--mute:#8791b0;--acc:#ffc24a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 520px at 12% -6%,#1d2a5a77,transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input{font:inherit;color:inherit}header{position:sticky;top:0;z-index:5;background:#080b14c8;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:12px 20px;display:flex;gap:10px;align-items:center}.logo{font-weight:900;font-size:20px;letter-spacing:.05em;color:var(--acc)}.sp{flex:1}
main{max-width:1100px;margin:auto;padding:20px 20px 60px}h1{margin:0 0 4px;font-size:28px}.mute{color:var(--mute);font-size:13px}
.btn{border:1px solid var(--line);background:var(--pan);padding:9px 18px;border-radius:12px;cursor:pointer;font-weight:700;transition:.15s}.btn:hover{transform:translateY(-1px);background:#1b2440}.btn:active{transform:scale(.96)}.btn.p{background:linear-gradient(135deg,#ffc24a,#ff8a3d);color:#2a1500;border:0}.btn.s{padding:4px 10px;font-size:13px}.btn.d{color:#ff6b6b}
input{background:#0a0f1d;border:1px solid var(--line);border-radius:11px;padding:10px 13px;width:100%}input:focus{outline:none;border-color:var(--acc)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin:18px 0}.panel{background:#111729cc;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.panel h3{margin:0 0 10px}
.lr{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--row);border-radius:12px;margin-top:8px;animation:up .4s backwards}.lr img{width:42px;height:42px;border-radius:50%;border:2px solid var(--acc);image-rendering:pixelated}.lr .n{flex:1;font-weight:800}.lr b.v{color:var(--acc);font-size:18px}.md{font-size:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:180px}
.stage{min-height:440px;display:grid;place-items:center;text-align:center;background:linear-gradient(#131a2f,#0d1222);border:1px solid var(--line);border-radius:20px;padding:20px;gap:12px;align-content:center}
.pad{width:100%;min-height:330px;border-radius:18px;display:grid;place-items:center;font-size:22px;font-weight:800;user-select:none;cursor:pointer;background:#1a2340;border:2px dashed #3a4a7c}.pad b{font-size:70px;display:block;color:var(--acc)}
.pad.wait{background:#5b1a1a;border-color:#a33}.pad.go{background:#14663a;border-color:#3d3}.pad.early{background:#6b4a10;border-color:#da3}
.big{font-size:110px;font-weight:900;color:var(--acc);animation:pop .5s}.key{font-size:120px;font-weight:900;background:#1a2340;border:3px solid var(--acc);border-radius:24px;padding:10px 50px;color:var(--acc)}.key.bad{border-color:#f55;animation:sh .25s}
.arena{position:relative;width:100%;height:380px;background:#0a0f1d;border-radius:16px;border:1px solid var(--line);overflow:hidden;cursor:crosshair}.tg{position:absolute;border-radius:50%;background:radial-gradient(#fff 0 12%,#ff4d4d 14% 40%,#fff 42% 55%,#ff4d4d 57%);cursor:crosshair}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:100%}.sc{background:var(--row);border-radius:14px;padding:14px}.sc b{display:block;font-size:26px;color:var(--acc)}
.ov{position:fixed;inset:0;background:#03050bcc;display:grid;place-items:center;padding:16px;z-index:20}.modal{background:#121a30;border:1px solid var(--line);border-radius:18px;padding:22px;width:min(420px,100%);display:grid;gap:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:30;width:max-content;max-width:92vw}.t{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px}
table{width:100%;border-collapse:collapse}td{padding:5px}.emb .logo{display:none}
@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes pop{from{opacity:0;transform:scale(.4)}}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head><body>
<header><div class="bar"><div class="logo">🎯 PvP WARMUP</div><div class="sp"></div><button class="btn s" id="lg" onclick="mlogin()">Manager login</button></div></header>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const NS=(location.pathname.split('/')[1]||'root')+':';if(top!==self)document.documentElement.classList.add('emb');
const DP=(a=>a.slice(2,-1).length?a.slice(2,-1).join('/')+'/data.json':'data.json')(location.pathname.split('/'));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let D={mgr:'',players:[]},mg=sessionStorage[NS+'wm']==='1',API='';const DEFK=['1','2','3','4','5','r','c','q','v'];
function toast(m,ms=3500){$('#toast').innerHTML='<div class="t">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',ms)}
function repo(){if(localStorage[NS+'repo'])return localStorage[NS+'repo'];const h=location.hostname;if(!h.endsWith('github.io'))return'';let s=location.pathname.split('/')[1];if(!s||s.endsWith('.html'))s=h;return h.split('.')[0]+'/'+s}
async function fresh(p,rel){const r=repo();if(r){try{const x=await fetch(`https://api.github.com/repos/${r}/contents/${p}`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(x.ok)return await x.json()}catch(e){}}try{return await(await fetch(rel+'?'+Date.now())).json()}catch(e){return null}}
async function load(){const d=await fresh(DP,'data.json'),c=await fresh('site.json','../site.json');if(d)D={mgr:d.mgr,players:d.players||[]};API=(c&&c.signupUrl)||''}
async function push(){const tk=(localStorage[NS+'tk']||'').replace(/[\s"']/g,''),r=repo();if(!tk||!r){toast('Add your GitHub token and repo first',6000);return}
 const u=`https://api.github.com/repos/${r}/contents/${DP}`,h={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
 try{for(let a=0;a<3;a++){const g=await fetch(u+'?t='+Date.now(),{headers:h,cache:'no-store'}),j=g.ok?await g.json():null,b={message:'Update warmup',content:btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1))))};if(j&&j.sha)b.sha=j.sha;
  const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(b)});if(p.ok){toast('Saved ✓');return}if(p.status!==409&&p.status!==422){toast('GitHub refused ('+p.status+'). Check token and repo.',8000);return}await new Promise(z=>setTimeout(z,700))}}catch(e){toast('Network error: '+e.message,8000)}}
/* stats */
const day=t=>new Date(t).toISOString().slice(0,10),DAY=864e5;
function streak(p){const d=p.days||{};let c=d[day(Date.now())]?Date.now():Date.now()-DAY,n=0;while(d[day(c)]){n++;c-=DAY}return n}
function sharp(p){const v=Object.keys(p.days||{}).sort().slice(-7).map(k=>p.days[k].score);return v.length?Math.round(v.reduce((a,b)=>a+b)/v.length):0}
const find=n=>D.players.find(p=>p.name.toLowerCase()===n.toLowerCase());
const av=n=>`<img alt="" src="https://mc-heads.net/avatar/${encodeURIComponent(n)}/64" onerror="this.style.visibility='hidden'">`;
function top3(fn,val,sub){const l=D.players.map(p=>({p,v:fn(p)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,3);return l.map((x,i)=>`<div class="lr" style="animation-delay:${i*80}ms"><span class="md">${['🥇','🥈','🥉'][i]}</span>${av(x.p.name)}<span class="n">${esc(x.p.name)}<div class="mute">${sub(x.p)}</div></span><b class="v">${val(x.v)}</b></div>`).join('')||'<div class="mute">No warmups logged yet. Be the first!</div>'}
const last=p=>{const k=Object.keys(p.days||{}).sort().pop();return k?p.days[k]:null};
function home(){$('#app').innerHTML=`<h1>Daily Warmup</h1><div class="mute">Left click → right click → hotkeys → aim → reaction. Do it every day to build your streak.</div>
<div class="two"><div class="panel"><h3>🔥 Top streaks</h3>${top3(streak,v=>v+' day'+(v>1?'s':''),p=>{const l=last(p);return l?`${l.cps} CPS · ${l.react}ms reaction`:''})}</div><div class="panel"><h3>⚡ Sharpest warmuppers</h3>${top3(sharp,v=>v+' pts',p=>{const l=last(p);return l?`${l.hk}ms hotkeys · ${l.flick}ms flicks`:''})}</div></div>
<div class="panel"><h3>Start your warmup</h3><div class="row"><input id="ign" maxlength="16" placeholder="Your IGN" value="${esc(localStorage[NS+'ign']||'')}" onkeydown="if(event.key==='Enter')begin()"><button class="btn p" onclick="begin()">Start warmup</button></div><div class="mute" style="margin-top:8px">One warmup per day counts toward your streak (your best score of the day is kept).</div></div>${mg?mgr():''}`}
/* drills */
const stage=h=>$('#app').innerHTML=`<div class="stage">${h}</div>`,wait=ms=>new Promise(r=>setTimeout(r,ms)),avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
async function ready(t,d){stage(`<h2>${t}</h2><p class="mute">${d}</p><button class="btn p" id="go">Start</button>`);await new Promise(r=>$('#go').onclick=r);for(let i=3;i>0;i--){stage(`<div class="big">${i}</div>`);await wait(700)}}
const cpsD=r=>new Promise(res=>{let n=0,t0=0,iv;stage(`<div class="pad" id="pad"><div>${r?'Right':'Left'} click here<b id="cn">0</b><span class="mute" id="tm">20.0s · starts on your first click</span></div></div>`);const pad=$('#pad');pad.oncontextmenu=e=>e.preventDefault();
 pad.onmousedown=e=>{e.preventDefault();if(e.button!==(r?2:0))return;if(!t0){t0=performance.now();iv=setInterval(()=>{const l=20-(performance.now()-t0)/1000;$('#tm').textContent=Math.max(l,0).toFixed(1)+'s';if(l<=0){clearInterval(iv);pad.onmousedown=null;res(n/20)}},50)}n++;$('#cn').textContent=n}});
const hkD=k=>new Promise(res=>{let i=0,t=performance.now(),ts=[];const tot=k.length*2,draw=()=>{stage(`<div class="mute">${i+1} / ${tot}</div><div class="key">${esc(k[i%k.length].toUpperCase())}</div>`)};draw();
 const on=e=>{e.preventDefault();if(e.key.toLowerCase()!==k[i%k.length].toLowerCase()){$('.key').classList.add('bad');return}const n=performance.now();ts.push(n-t);t=n;i++;if(i>=tot){removeEventListener('keydown',on);res(avg(ts))}else draw()};addEventListener('keydown',on)});
const aimD=()=>new Promise(res=>{let n=0,ts=[];stage('<div class="arena" id="ar"></div><div class="mute" id="an">0 / 15</div>');const ar=$('#ar'),nx=()=>{ar.innerHTML='';const s=56,d=document.createElement('div');d.className='tg';d.style.cssText=`left:${Math.random()*(ar.clientWidth-s)}px;top:${Math.random()*(ar.clientHeight-s)}px;width:${s}px;height:${s}px`;const t=performance.now();d.onmousedown=()=>{ts.push(performance.now()-t);n++;$('#an').textContent=n+' / 15';n>=15?res(avg(ts)):nx()};ar.appendChild(d)};nx()});
async function reactD(){const ts=[];for(let i=0;i<5;i++)ts.push(await new Promise(res=>{stage(`<div class="pad wait" id="rc"></div>`);const el=$('#rc');let t0=0,to;const arm=()=>{t0=0;el.className='pad wait';el.textContent=`Wait for green… (${i+1}/5)`;to=setTimeout(()=>{el.className='pad go';el.textContent='CLICK!';t0=performance.now()},1000+Math.random()*3000)};arm();
 el.onmousedown=()=>{if(t0)res(performance.now()-t0);else{clearTimeout(to);el.className='pad early';el.textContent='Too early! Wait for green…';to=setTimeout(arm,900)}}}));return avg(ts)}
async function begin(){const n=$('#ign').value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(n))return toast('Enter a valid IGN (3–16 letters, numbers or _)');localStorage[NS+'ign']=n;
 const p=find(n),keys=(p&&p.hotkeys&&p.hotkeys.length?p.hotkeys:DEFK);
 await ready('Left click','Click as fast as you can for 20 seconds.');const L=await cpsD(0);
 await ready('Right click','Same thing, now with right click. 20 seconds.');const R=await cpsD(1);
 await ready('Hotkeys','Press each key shown, in order. Your keys: '+keys.join(' ').toUpperCase()+' (two rounds).');const hk=await hkD(keys);
 await ready('Aim','Click 15 targets as fast as you can.');const fl=await aimD();
 await ready('Reaction','5 rounds. Click the moment the screen turns green.');const re=await reactD();
 const s={cps:+((L+R)/2).toFixed(1),hk:Math.round(hk),flick:Math.round(fl),react:Math.round(re)};s.score=Math.round(s.cps*6+12000/s.hk+20000/s.flick+10000/s.react);
 stage(`<h2>Warmup complete! 🎉</h2><div class="sg"><div class="sc"><b>${s.cps}</b>avg CPS</div><div class="sc"><b>${s.hk}ms</b>hotkey speed</div><div class="sc"><b>${s.flick}ms</b>flick speed</div><div class="sc"><b>${s.react}ms</b>reaction</div><div class="sc"><b>${s.score}</b>sharpness score</div></div><div class="mute" id="sv">Saving…</div><button class="btn p" onclick="boot()">Back to leaderboard</button>`);
 if(!API){$('#sv').textContent='Not saved: warmup saving isn’t connected yet (see README).';return}
 try{const r=await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'warmup',ign:n,stats:s})})).json();$('#sv').textContent=r.error?'Not saved: '+r.error:'Saved ✓ Streak: '+(r.streak||1)+' day(s)'}catch(e){$('#sv').textContent='Could not reach the saving service.'}}
/* manager */
function modal(h){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)this.remove()"><div class="modal">${h}</div></div>`}
function mlogin(){if(mg){mg=false;sessionStorage[NS+'wm']='0';return boot()}modal(`<h3>Manager login</h3><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')mdo()"><div class="row"><button class="btn p" onclick="mdo()">Sign in</button></div>`);$('#pw').focus()}
async function mdo(){if(await sha($('#pw').value)!==D.mgr)return toast('Wrong password');mg=true;sessionStorage[NS+'wm']='1';$('#modal').innerHTML='';boot()}
function mgr(){return `<div class="panel"><h3>Manager: hotkeys</h3><div class="mute">Set each player’s hotkeys in order, separated by spaces (example: 1 x 3 4 5 r c q v). Players without hotkeys use: ${DEFK.join(' ')}.</div><table>${D.players.map((p,i)=>`<tr><td style="width:30%">${esc(p.name)}</td><td><input value="${esc((p.hotkeys||[]).join(' '))}" placeholder="default" oninput="D.players[${i}].hotkeys=this.value.trim().split(/\\s+/).filter(Boolean)"></td><td><button class="btn s d" onclick="delP(${i})">✕</button></td></tr>`).join('')}</table>
 <div class="row" style="margin-top:10px"><input id="np" placeholder="Add player IGN"><button class="btn s" onclick="addP()">Add</button></div>
 <div class="row" style="margin-top:14px"><input id="tk" type="password" placeholder="GitHub token" value="${esc(localStorage[NS+'tk']||'')}"><input id="rp" placeholder="owner/repo" value="${esc(repo())}"><button class="btn p" onclick="msave()">Save changes</button></div></div>`}
function addP(){const n=$('#np').value.trim();if(!/^[A-Za-z0-9_]{3,16}$/.test(n)||find(n))return toast('Invalid or duplicate IGN');D.players.push({id:Math.random().toString(36).slice(2,9),name:n,hotkeys:[],days:{}});home()}
function delP(i){if(confirm('Remove '+D.players[i].name+' and their history?')){D.players.splice(i,1);home()}}
async function msave(){localStorage[NS+'tk']=$('#tk').value.trim();localStorage[NS+'repo']=$('#rp').value.trim();await push()}
async function boot(){home()}
load().then(boot);
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Library</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--pan:#111729;--row:#141b30;--line:#222c48;--ink:#eef1fb;--mute:#8791b0;--acc:#ffc24a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 520px at 12% -6%,#1d2a5a77,transparent),radial-gradient(800px 520px at 92% 0,#5a1d6a44,transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}main{max-width:1240px;margin:auto;padding:24px 20px 70px}h1{margin:0 0 4px;font-size:30px}.mute{color:var(--mute);font-size:13px}.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--pan);padding:9px 18px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);display:inline-block;transition:.15s}.btn:hover{transform:translateY(-2px);background:#1b2440}.btn:active{transform:scale(.96)}.btn.p{background:linear-gradient(135deg,#ffc24a,#ff8a3d);color:#2a1500;border:0}.btn.s{padding:5px 12px;font-size:13px}.btn.d{color:#ff6b6b}
input,select,textarea{background:#0a0f1d;border:1px solid var(--line);border-radius:11px;padding:10px 13px;width:100%;transition:.2s}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #ffc24a30}
.top{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.pg{animation:up .5s}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.seg button{border:1px solid var(--line);background:var(--pan);border-radius:99px;padding:8px 18px;cursor:pointer;font-weight:700;color:var(--mute);transition:.2s}.seg button:hover{color:var(--ink);transform:translateY(-2px)}.seg button.on{background:linear-gradient(135deg,#ffc24a,#ff8a3d);color:#2a1500;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.cd{background:linear-gradient(#151d36,#0f1528);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}.enter .cd{animation:up .5s backwards;animation-delay:calc(var(--i)*45ms)}
.cd:hover{transform:translateY(-6px);border-color:#4a5a90;box-shadow:0 18px 40px #000a}.cv{position:relative;aspect-ratio:16/10;background:#0a0f1d;overflow:hidden}.cv img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.cd:hover .cv img{transform:scale(1.06)}.cv.sq img,.dc.sq img{object-fit:contain;padding:10px}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:54px;font-weight:900;color:var(--acc);background:linear-gradient(135deg,#1c2650,#101830)}.pl{position:absolute;right:10px;bottom:10px;background:#ff0000cc;border-radius:8px;padding:2px 10px;font-size:13px}
.cb{padding:14px 16px 16px}.cb h3{margin:0 0 4px;font-size:18px}.cb p{margin:0 0 10px;color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.ft{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#ffffff12;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600}.chip.v{background:#ffc24a22;color:var(--acc)}
.sec{margin:28px 2px 12px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}.sec small{color:var(--mute);font-size:13px;font-weight:600}.sec::after{content:'';flex:1;height:1px;background:var(--line)}.sec:first-of-type{margin-top:6px}
.empty{padding:50px;text-align:center;color:var(--mute);background:#111729cc;border-radius:18px}
.dt{display:grid;grid-template-columns:minmax(260px,440px) 1fr;gap:26px;margin-top:18px;align-items:start}.dc,.vid{border-radius:20px;overflow:hidden;background:#0a0f1d;border:1px solid var(--line);aspect-ratio:16/10}.vid{aspect-ratio:16/9}.dc img{width:100%;height:100%;object-fit:cover}.vid iframe{width:100%;height:100%;border:0}
.di h1{font-size:34px}.ds{white-space:pre-wrap;color:#cdd4ea;margin:14px 0 20px}@media (max-width:800px){.dt{grid-template-columns:1fr}}
.ov{position:fixed;inset:0;background:#03050bcc;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:60;overflow:auto;animation:fin .2s}.ov.out{animation:fout .18s forwards}.modal{background:#131a30;border:1px solid var(--line);border-radius:20px;padding:22px;width:min(520px,100%);display:grid;gap:12px;animation:zoom .3s cubic-bezier(.2,.8,.2,1)}.modal h3{margin:0}.modal label{display:grid;gap:5px;font-size:13px;font-weight:600}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:70;width:max-content;max-width:92vw}.t{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;animation:up .3s}.ic{width:1em;height:1em;vertical-align:-.12em}
@keyframes up{from{opacity:0;transform:translateY(16px)}}@keyframes fin{from{opacity:0}}@keyframes fout{to{opacity:0}}@keyframes zoom{from{opacity:0;transform:translateY(14px) scale(.96)}}@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style><script src="../px.js"></script></head><body><main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const NS=(location.pathname.split('/')[1]||'root')+':';const G=new URLSearchParams(location.search).get('t')==='guides',T=G?'guides':'packs',CFG=G?{name:'PvP Guides',icon:'🎬'}:{name:'Texture Packs',icon:'🎨'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DEF=[['crystal','Crystal','🔮'],['mace','Mace','🔨'],['spear','Spear Mace','🔱'],['pot','Netherite Pot','🧪'],['dsmp','Diamond SMP','💎'],['uhc','UHC','❤️'],['smp','SMP','🌍'],['cart','Cart','🚃']].map(([id,name,icon])=>({id,name,icon}));
let F,MODES=DEF,items=[],adm=false,sec='all',view=null,tt;
const isM=()=>adm&&top!==self&&sessionStorage[NS+'sm']==='1';
function toast(m,ms=3500){$('#toast').innerHTML='<div class="t">'+esc(m)+'</div>';clearTimeout(tt);tt=setTimeout(()=>$('#toast').innerHTML='',ms)}
const closeModal=()=>{const o=document.querySelector('.ov');if(o){o.classList.add('out');setTimeout(()=>o.remove(),180)}};const modal=h=>$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()"><div class="modal">${h}</div></div>`;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const ic=m=>/^(data:|https?:)/.test(m.icon)?`<img class="ic" src="${esc(m.icon)}" alt="">`:esc(m.icon),mo=id=>MODES.find(m=>m.id===id)||{id:'',name:'General',icon:'🌐'};
const vcmp=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<4;i++){const d=(y[i]||0)-(x[i]||0);if(d)return d}return 0};
const title=x=>G?(x.title||'Video guide'):x.name,thumb=x=>G?`https://img.youtube.com/vi/${x.vid}/hqdefault.jpg`:x.cover;
const chips=x=>`<div class="ft">${!G&&x.version?`<span class="chip v">${esc(x.version)}</span>`:''}<span class="chip">${ic(mo(x.mode))} ${esc(mo(x.mode).name)}</span></div>`;
const card=(x,i)=>`<div class="cd" style="--i:${Math.min(i,20)}" onclick="show('${x.id}')"><div class="cv${x.sq?' sq':''}">${thumb(x)?`<img loading="lazy" alt="" src="${esc(thumb(x))}">`:`<div class="ph">${esc((title(x)||'?')[0].toUpperCase())}</div>`}${G?'<span class="pl">▶</span>':''}</div><div class="cb"><h3>${esc(title(x))}</h3><p>${esc(x.desc||'')}</p>${chips(x)}</div></div>`;
function body(){const L=[...items].sort((a,b)=>b.ts-a.ts);if(!L.length)return `<div class="empty">Nothing here yet.${isM()?' Use the button above to add the first one!':''}</div>`;
 if(sec==='all')return `<div class="grid">${L.map(card).join('')}</div>`;
 const kf=sec==='mode'?x=>x.mode||'':x=>x.version||'Unknown';let ks=[...new Set(L.map(kf))];
 ks=sec==='mode'?[...MODES.map(m=>m.id).filter(k=>ks.includes(k)),...ks.filter(k=>!MODES.some(m=>m.id===k))]:ks.sort(vcmp);
 return ks.map(k=>{const g=L.filter(x=>kf(x)===k);return `<div class="sec">${sec==='mode'?ic(mo(k))+' '+esc(mo(k).name):esc(k)}<small>${g.length}</small></div><div class="grid">${g.map(card).join('')}</div>`}).join('')}
const detail=x=>`<div class="pg"><button class="btn s" onclick="view=null;render(1)">← Back to ${CFG.name}</button><div class="dt">${G?`<div class="vid"><iframe src="https://www.youtube.com/embed/${esc(x.vid)}" allowfullscreen allow="encrypted-media; picture-in-picture; fullscreen"></iframe></div>`:`<div class="dc${x.sq?' sq':''}">${x.cover?`<img alt="" src="${esc(x.cover)}">`:`<div class="ph">${esc(x.name[0])}</div>`}</div>`}<div class="di"><h1>${esc(title(x))}</h1>${chips(x)}<p class="ds">${esc(x.desc||'No description.')}</p><div class="row">${G?`<a class="btn p" href="${esc(x.url)}" target="_blank" rel="noopener">Open on YouTube</a>`:`<a class="btn p" href="${esc(x.link)}" target="_blank" rel="noopener" download>⬇ Download</a>`}${isM()?`<button class="btn d" onclick="del('${x.id}')">Delete</button>`:''}</div></div></div></div>`;
function render(fx){const a=$('#app'),x=view&&items.find(y=>y.id===view);if(view&&!x)view=null;a.className=fx?'enter':'';
 a.innerHTML=x?detail(x):`<div class="pg"><div class="top"><div><h1>${CFG.icon} ${CFG.name}</h1><div class="mute">${G?'Watch guides for every gamemode.':'Browse and download PvP texture packs.'}</div></div><div class="sp"></div>${isM()?`<button class="btn p" onclick="addForm()">+ Add ${G?'guide':'pack'}</button>`:''}</div><div class="seg">${[['all','All'],['mode','Sorted by gamemode'],...(G?[]:[['version','Sorted by version']])].map(([k,l])=>`<button class="${sec===k?'on':''}" onclick="sec='${k}';render(1)">${l}</button>`).join('')}</div>${body()}</div>`}
function show(id){view=id;render(1);scrollTo(0,0)}
function del(id){if(confirm('Delete this?')){F.delItem(T,id);view=null;toast('Deleted')}}
/* helpers for covers / uploads */
const loadJS=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
const draw=(f,w,h,smooth,type)=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w(im);c.height=h(im);const x=c.getContext('2d');x.imageSmoothingEnabled=smooth;x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL(type,.82))};im.onerror=()=>no(new Error('Could not read that image'));im.src=u});
const coverImg=f=>draw(f,i=>Math.round(i.width*Math.min(1,480/i.width)),i=>Math.round(i.height*Math.min(1,480/i.width)),true,'image/jpeg');
async function coverFromZip(f){await loadJS('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');const z=await JSZip.loadAsync(f),e=z.file('pack.png')||z.file(/(^|\/)pack\.png$/i)[0];return e?draw(await e.async('blob'),()=>256,()=>256,false,'image/png'):''}
function repo(){if(localStorage[NS+'repo'])return localStorage[NS+'repo'];const h=location.hostname;if(!h.endsWith('github.io'))return'';let s=location.pathname.split('/')[1];if(!s||s.endsWith('.html'))s=h;return h.split('.')[0]+'/'+s}
async function ghPut(path,f){const tk=(localStorage[NS+'tk']||'').replace(/[\s"']/g,''),r=repo();if(!tk||!r)throw new Error('Add your GitHub token first (manager window, bottom-right of the site)');if(f.size>50e6)throw new Error('That file is over 50 MB. Upload it elsewhere and paste the link instead');
 const b=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(fr.result.split(',')[1]);fr.readAsDataURL(f)});
 const p=await fetch(`https://api.github.com/repos/${r}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'},body:JSON.stringify({message:'Add texture pack file',content:b})});if(!p.ok)throw new Error('GitHub refused the upload ('+p.status+')')}
const modeOpts=()=>`<option value="">General</option>${MODES.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}`;
function addForm(){modal(G?`<h3>Add a guide</h3><label>YouTube link<input id="f_l" placeholder="https://www.youtube.com/watch?v=…"></label><label>Best for<select id="f_m">${modeOpts()}</select></label><label>Description<textarea id="f_d" rows="4"></textarea></label><div class="row"><div class="sp"></div><button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="saveGuide()">Add guide</button></div>`
 :`<h3>Add a texture pack</h3><label>Name<input id="f_n"></label><label>Description<textarea id="f_d" rows="3"></textarea></label><div class="two"><label>Version<input id="f_v" placeholder="1.21.11" list="vl"></label><label>Best for<select id="f_m">${modeOpts()}</select></label></div><datalist id="vl">${[...new Set(items.map(x=>x.version).filter(Boolean))].map(v=>`<option value="${esc(v)}">`).join('')}</datalist>
 <label>Upload the .zip (up to 50 MB)<input type="file" id="zf" accept=".zip"></label><label>…or paste a download link instead<input id="lk" placeholder="https://…"></label><label>Cover image (optional; leave blank to use pack.png from the zip)<input type="file" id="cf" accept="image/*"></label><div class="row"><div class="sp"></div><button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="savePack()">Add pack</button></div>`)}
async function savePack(){const n=$('#f_n').value.trim(),f=$('#zf').files[0],link=$('#lk').value.trim(),cf=$('#cf').files[0];if(!n)return toast('Enter a name');if(!f&&!link)return toast('Add a .zip or paste a download link');
 toast('Working… large files take a moment',30000);try{let cover='',sq=false;if(cf)cover=await coverImg(cf);else if(f){try{cover=await coverFromZip(f);sq=!!cover}catch(e){}}
  let url=link;if(f){const nm=Date.now()+'-'+f.name.replace(/[^A-Za-z0-9._-]/g,'_');await ghPut('packs-files/'+nm,f);url=new URL('../packs-files/'+nm,location.href).href}
  await F.addItem('packs',{name:n,desc:$('#f_d').value.trim(),version:$('#f_v').value.trim(),mode:$('#f_m').value,link:url,cover,sq,ts:Date.now()});closeModal();toast(f?'Pack added ✓ (the download link works once GitHub finishes publishing, about a minute)':'Pack added ✓',7000)}catch(e){toast('Could not add: '+e.message,9000)}}
async function saveGuide(){const l=$('#f_l').value.trim(),m=l.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/);if(!m)return toast('Paste a valid YouTube link');toast('Adding…',20000);
 try{let t='';try{t=(await(await fetch('https://noembed.com/embed?url='+encodeURIComponent(l))).json()).title||''}catch(e){}
  await F.addItem('guides',{vid:m[1],url:'https://www.youtube.com/watch?v='+m[1],title:t,desc:$('#f_d').value.trim(),mode:$('#f_m').value,ts:Date.now()});closeModal();toast('Guide added ✓')}catch(e){toast('Could not add: '+e.message,8000)}}
(async()=>{F=await import('../fb.js');adm=!!(await F.user());try{const l=await F.getModes();if(l&&l.length)MODES=l}catch(e){}F.watchColl(T,l=>{items=l;render()});render(1)})().catch(e=>{$('#app').innerHTML='<div class="empty">Could not load: '+esc(e.message)+'</div>'});
</script></body></html>

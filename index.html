<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PvP Nerds</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
<style>
:root{color-scheme:dark;--bg:#080b14;--pan:#111729;--row:#141b30;--line:#222c48;--ink:#eef1fb;--mute:#8791b0;--acc:#ffc24a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 520px at 12% -6%,#1d2a5a77,transparent),radial-gradient(800px 520px at 92% 0,#5a1d6a44,transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0);z-index:9;padding:12px 16px 0}
.nv{max-width:1180px;margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#0d1222f2;border:1px solid var(--line);border-radius:18px;padding:0 10px;box-shadow:0 12px 40px #0008}
.g{display:flex;justify-content:space-evenly;align-items:center;gap:4px}
.nv a{color:#cfd6ee;text-decoration:none;font-weight:700;padding:17px 14px;white-space:nowrap;border-bottom:2px solid transparent;transition:.2s}.nv a:hover{color:#fff}.nv a.on{color:var(--acc);border-color:var(--acc)}
.nv a.brand{display:grid;justify-items:center;line-height:1;gap:3px;padding:16px 32px;margin:-4px 12px;background:#0a0e1b;border:1px solid var(--line);border-radius:0 0 16px 16px}
.brand b{font-size:28px;font-weight:900;letter-spacing:.05em;background:linear-gradient(90deg,#ffd76a,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent}.brand span{font-size:11px;letter-spacing:.38em;color:var(--mute)}
.nv a.su{background:linear-gradient(135deg,#ff4d4d,#b81414);color:#fff;border-radius:10px;padding:9px 16px;border:0;margin:0 6px;box-shadow:0 6px 20px #ff4d4d33}
main{max-width:1180px;margin:auto;padding:22px 16px 60px;animation:up .4s}
.fr{width:100%;height:calc(100vh - 96px);min-height:520px;border:1px solid var(--line);border-radius:18px;background:var(--bg)}main.wide{max-width:1380px;padding-top:14px}
.hero{text-align:center;padding:60px 20px 40px}.hero h1{margin:0;font-size:clamp(40px,8vw,76px);font-weight:900;letter-spacing:.04em;background:linear-gradient(90deg,#ffd76a,#ff8a3d,#ff5d73);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);font-size:18px;max-width:620px;margin:10px auto 24px}
.btn{border:1px solid var(--line);background:var(--pan);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);display:inline-block;transition:.15s}.btn:hover{transform:translateY(-2px);background:#1b2440}.btn.p{background:linear-gradient(135deg,#ffc24a,#ff8a3d);color:#2a1500;border:0}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0 30px}.st{background:#111729cc;border:1px solid var(--line);border-radius:16px;padding:14px 26px;text-align:center;min-width:140px}.st b{display:block;font-size:30px;color:var(--acc)}.st span{color:var(--mute);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.cd{background:linear-gradient(#151d36,#0f1528);border:1px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;color:var(--ink);transition:.2s}.cd:hover{transform:translateY(-4px);border-color:#3a4a7c;box-shadow:0 14px 34px #0008}.cd i{font-style:normal;font-size:36px}.cd h3{margin:8px 0 4px}.cd p{margin:0;color:var(--mute);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:var(--pan);border-radius:99px;padding:8px 18px;cursor:pointer;font-weight:700;color:var(--mute);transition:.2s}.tab.on{background:linear-gradient(135deg,#ffc24a,#ff8a3d);color:#2a1500;border:0}
.doc{background:#111729cc;border:1px solid var(--line);border-radius:20px;padding:26px 30px}.doc h2{margin:22px 0 6px;font-size:24px}.doc h2:first-child{margin-top:0}.doc h3{margin:16px 0 4px;color:var(--acc)}.doc li{margin:5px 0}.doc p{color:#cdd4ea}.doc .tg{color:var(--mute)}
.su-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.tc{background:var(--pan);border:2px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:.2s}.tc:hover{border-color:#3a4a7c}.tc.on{border-color:var(--acc);box-shadow:0 0 30px #ffc24a22}.tc.full{opacity:.5;cursor:not-allowed}
.bar2{height:6px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#ffc24a,#ff8a3d)}.mute{color:var(--mute);font-size:13px}
.frm{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}input{background:#0a0f1d;border:1px solid var(--line);border-radius:11px;padding:11px 14px;flex:1;min-width:200px}input:focus{outline:none;border-color:var(--acc)}
.chip{display:inline-block;background:#ffffff10;border-radius:99px;padding:2px 10px;margin:3px 3px 0 0;font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;width:max-content;max-width:92vw}.t{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;animation:up .3s}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@media (max-width:900px){.nv{display:flex;flex-wrap:wrap;justify-content:center}.nv .brand{order:-1;flex-basis:100%;margin:0;border-radius:0 0 16px 16px}.g{flex-wrap:wrap}.nv a{padding:11px 10px}}
</style></head><body>
<header><nav class="nv">
<div class="g"><a href="#/home" data-r="home">🏠 Home</a><a href="#/warmup" data-r="warmup">🎯 PvP Warmup</a><a href="#/tiers" data-r="tiers">👑 PvP Tiers</a></div>
<a class="brand" href="#/info" data-r="info"><b>PvP NERDS</b><span>COMMUNITY</span></a>
<div class="g"><a href="#/tournaments" data-r="tournaments">🏆 Tournaments</a><a class="su" href="#/signup" data-r="signup">✍️ Sign Up</a></div>
</nav></header>
<main id="app"></main><div id="toast"></div>
<script>
const NS=(location.pathname.split('/')[1]||'root')+':';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function repo(){if(localStorage[NS+'repo'])return localStorage[NS+'repo'];const h=location.hostname;if(!h.endsWith('github.io'))return'';let s=location.pathname.split('/')[1];if(!s||s.endsWith('.html'))s=h;return h.split('.')[0]+'/'+s}
async function fresh(p){const r=repo();if(r){try{const x=await fetch(`https://api.github.com/repos/${r}/contents/${p}`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(x.ok)return await x.json()}catch(e){}}try{return await(await fetch(p+'?'+Date.now())).json()}catch(e){return null}}
function toast(m,ms=3500){$('#toast').innerHTML='<div class="t">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',ms)}
const fr=s=>`<iframe class="fr" src="${s}" title="${s}"></iframe>`,ul=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const INFO={
about:['About Us',()=>`<h2>Welcome to the PvP Nerds Community</h2><p>This is a private competitive PvP group.</p><h3>What do we do?</h3>${ul(['We track our own custom tierlist system so you can compare yourself accurately with other members in the community.','We host monthly tournaments to keep your PvP skills sharp.','We try to keep a kind community without toxicity.'])}<h3>How to get tested</h3>${ul(['Tests are done privately with a testee and a tester.','You can create a ticket in the discord to request a test and a tester will get with you as soon as possible.','The tests are completely based on what you can perform in that gamemode.'])}<h3>How to join a tournament</h3>${ul(['Check the website to see if there is an upcoming tournament.','Sign up on the <a href="#/signup" style="color:var(--acc)">Sign Up</a> page (remember, be fast! There are limited slots.)'])}`],
tiers:['PvP Nerd Tiers',()=>`<h2>Gamemodes</h2><p>The Tierlist consists of these main eight gamemodes. Make a suggestion to add another gamemode.</p>${ul(['Crystal','Mace','Spear Mace','Netherite Pot','Diamond SMP','UHC','SMP','Cart'])}<h2>Tiers</h2><p>These are the official tiers in our tierlist ranking from worst to best:</p><p><b>LT3 · MT3 · HT3 · LT2 · MT2 · HT2 · LT1 · MT1 · HT1</b></p><h2>Tier Interpretation</h2><h3>Tier 3</h3>${ul(['<b>LT3:</b> people who aren’t very good at that gamemode or have never played it (default tier)','<b>MT3:</b> people who can perform some widely used tactics in the gamemode','<b>HT3:</b> know half of known tactics in the gamemode, but still inconsistent'])}<h3>Tier 2</h3>${ul(['<b>LT2:</b> know half of known tactics in the gamemode, and slightly consistent with all','<b>MT2:</b> knows most of known tactics in the gamemode and still not consistent','<b>HT2:</b> can perform all known tactics inconsistently'])}<h3>Tier 1</h3>${ul(['<b>LT1:</b> can perform all known tactics consistently','<b>MT1:</b> second best in this gamemode','<b>HT1:</b> best in this gamemode'])}<p><a class="btn p" href="#/tiers">Open the tier list</a></p>`],
tester:['Becoming a Tester',()=>`<h2>Becoming a Tester</h2><p>These are the steps you must take to become a tester:</p>${ul(['Prove you are the best in the gamemode.','Able to point out most or all tactics used in the gamemode.','Be trusted in the community.','Absolute respect, zero toxicity.'])}<p><b>Complete an application to apply to be a tester!</b></p>`],
tourn:['Tournaments',()=>`<h2>About The System</h2><p>This is the tournament system for The PvP Nerds community. To keep everyone’s PvP skills sharp, you can sign up for new tournaments that will usually happen once a month. This is completely optional, however, you could get rewards just for playing!</p><h2>How to Join</h2><p>Joining a tournament is completely free and there are no risks in participation. Check if there is a scheduled tournament on the website. If there is one that is still accepting players, sign up on the Sign Up page. Each month there will be a new tournament on a different PvP gamemode.</p><h2>Rewards</h2><p>Rewards are generally going to be DonutSMP money. But, if you do not play DonutSMP, there could be other rewards. Let our team know that you would like a different reward when you sign up.</p><p><a class="btn p" href="#/tournaments">Open the tournament tracker</a></p>`],
rules:['Rules & Standards',()=>`<h2>Rules</h2>${ul(['toxicity is not tolerated, you will be immediately disqualified if there is proof','you cannot run an official tournament match without a tournament manager watching the fight live','reward money is for the winner, distributing it to other players is not allowed','when you win a tournament match, do not state so in the Discord as the fight must first be validated by the judges','be nice to all contestants and do not make excuses if you lose (judges will validate the fight completely, so no excuses)'])}<h2>Standards</h2>${ul(['check active tournaments live on the website','a fight is determined by the winner of a first to five game','a tournament match must be done in complete silence if both parties agree','the entire tournament takes place in the chosen server'])}`]};
function info(sub){const k=INFO[sub]?sub:'about';return `<div class="tabs">${Object.entries(INFO).map(([id,v])=>`<a class="tab ${id===k?'on':''}" href="#/info/${id}" style="text-decoration:none">${v[0]}</a>`).join('')}</div><div class="doc">${INFO[k][1]()}</div>`}
async function home(){$('#app').innerHTML=`<section class="hero"><h1>PvP NERDS</h1><p>A private competitive PvP community. Climb the tier list, sharpen your skills, win tournaments.</p><a class="btn p" href="#/tiers">View Tier List</a> <a class="btn" href="#/warmup">Start Warmup</a></section><div class="stats" id="stats"></div><div class="cards"><a class="cd" href="#/tiers"><i>👑</i><h3>PvP Tiers</h3><p>See where every player ranks in each gamemode.</p></a><a class="cd" href="#/tournaments"><i>🏆</i><h3>Tournaments</h3><p>Follow live brackets, results and rewards.</p></a><a class="cd" href="#/warmup"><i>🎯</i><h3>PvP Warmup</h3><p>Warm up your clicks, hotkeys, aim and reactions.</p></a><a class="cd" href="#/info"><i>📖</i><h3>Information</h3><p>How testing, tournaments and rules work.</p></a></div>`;
 const [a,b,c]=await Promise.all([fresh('tierlist/data.json'),fresh('tournaments/data.json'),fresh('warmup/data.json')]);if(location.hash.slice(2)&&location.hash.slice(2)!=='home')return;
 const live=b?(b.tournaments||[]).filter(t=>t.rounds&&!t.rounds[t.rounds.length-1][0].w).length:0,open=b?(b.tournaments||[]).filter(t=>!t.rounds).length:0;
 $('#stats').innerHTML=[[a?(a.players||[]).length:'–','Ranked players'],[b?live:'–','Live tournaments'],[b?open:'–','Open for sign-up'],[c?(c.players||[]).length:'–','Warmup players']].map(([n,l])=>`<div class="st"><b>${n}</b><span>${l}</span></div>`).join('')}
let sel=null;
async function signup(){$('#app').innerHTML='<div class="mute">Loading…</div>';const [d,cfg]=await Promise.all([fresh('tournaments/data.json'),fresh('site.json')]);if(location.hash!=='#/signup')return;
 const L=((d&&d.tournaments)||[]).filter(t=>!t.rounds);sel=L.find(t=>t.id===sel)?sel:(L.find(t=>!t.max||t.players.length<t.max)||{}).id;
 const ok=cfg&&cfg.signupUrl;
 $('#app').innerHTML=`<div style="margin-bottom:16px"><h1 style="margin:0">Tournament Sign Up</h1><div class="mute">Pick a tournament, enter your in-game name and you’ll be added automatically.</div></div>${L.length?`<div class="su-grid">${L.map(t=>{const f=t.max&&t.players.length>=t.max;return `<div class="tc ${t.id===sel?'on':''} ${f?'full':''}" onclick="${f?'':`sel='${t.id}';signup()`}"><b style="font-size:18px">${esc(t.title)}</b><div class="mute">${esc(t.server||'')}${t.date?' · '+esc(t.date):''}</div><div style="margin:8px 0">🎁 ${esc(t.prize||'No reward listed')}</div><div class="mute">${t.players.length}${t.max?'/'+t.max:''} signed up${f?' · FULL':''}</div>${t.max?`<div class="bar2"><i style="width:${Math.min(100,t.players.length/t.max*100)}%"></i></div>`:''}<div>${t.players.map(p=>`<span class="chip">${esc(p.name)}</span>`).join('')}</div></div>`}).join('')}</div>
 <div class="frm"><input id="ign" maxlength="16" placeholder="Your Minecraft IGN" value="${esc(localStorage[NS+'ign']||'')}" onkeydown="if(event.key==='Enter')join()"><button class="btn p" onclick="join()">Sign up</button></div>${ok?'':'<div class="mute" style="margin-top:10px">⚠ Sign-ups aren’t connected yet. The site manager needs to finish the setup in the README (signupUrl in site.json).</div>'}`:'<div class="doc">No tournaments are accepting players right now. Check back soon!</div>'}`}
async function join(){const n=$('#ign').value.trim(),cfg=await fresh('site.json');if(!sel)return toast('Pick a tournament first');if(!/^[A-Za-z0-9_]{3,16}$/.test(n))return toast('Enter a valid IGN (3–16 letters, numbers or _)');
 if(!cfg||!cfg.signupUrl)return toast('Sign-ups are not connected yet',5000);toast('Signing you up…');localStorage[NS+'ign']=n;
 try{const r=await(await fetch(cfg.signupUrl,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'signup',tid:sel,ign:n})})).json();if(r.error)toast(r.error,5000);else{toast('✅ You’re in, '+n+'!',5000);signup()}}catch(e){toast('Could not reach the sign-up service',5000)}}
function route(){const [k,sub]=(location.hash.slice(2)||'home').split('/'),a=$('#app');document.querySelectorAll('.nv a[data-r]').forEach(e=>e.classList.toggle('on',e.dataset.r===k));a.className='';scrollTo(0,0);
 if(k==='tiers'||k==='warmup'||k==='tournaments'){a.className='wide';a.innerHTML=fr({tiers:'tierlist/',warmup:'warmup/',tournaments:'tournaments/'}[k])}
 else if(k==='info')a.innerHTML=info(sub);else if(k==='signup')signup();else home()}
addEventListener('hashchange',route);route();
</script></body></html>

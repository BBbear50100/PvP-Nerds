<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PvP Nerds</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>">
<style>
:root{color-scheme:dark;--bg:#080b14;--pan:#111729;--row:#141b30;--line:#222c48;--ink:#eef1fb;--mute:#8791b0;--acc:#ffc24a}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}body.lock{overflow:hidden}
body::before,body::after{content:'';position:fixed;width:620px;height:620px;border-radius:50%;pointer-events:none;z-index:-1;filter:blur(30px)}
body::before{background:radial-gradient(#ffc24a30,transparent 68%);left:-160px;top:10%;animation:drift 16s ease-in-out infinite alternate}body::after{background:radial-gradient(#7a2dd04a,transparent 68%);right:-180px;top:-80px;animation:drift 21s ease-in-out infinite alternate-reverse}
button,input,label{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:30;padding:12px 16px 10px;animation:down .6s cubic-bezier(.2,.8,.2,1)}
.nv{max-width:1180px;margin:auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#0d1222ee;border:1px solid var(--line);border-radius:18px;padding:0 10px;box-shadow:0 12px 40px #0008;backdrop-filter:blur(10px)}
.g{display:flex;justify-content:space-evenly;align-items:center;gap:4px}
.nv a{position:relative;color:#cfd6ee;text-decoration:none;font-weight:700;padding:17px 14px;white-space:nowrap;transition:color .2s,transform .2s}.nv a::after{content:'';position:absolute;left:14px;right:14px;bottom:9px;height:2px;border-radius:2px;background:linear-gradient(90deg,#ffd76a,#ff8a3d);transform:scaleX(0);transition:transform .3s}
.nv a:hover{color:#fff;transform:translateY(-2px)}.nv a:hover::after,.nv a.on::after{transform:scaleX(1)}.nv a.on{color:var(--acc)}
.nv a.brand{display:grid;justify-items:center;line-height:1;gap:3px;padding:16px 32px;margin:-4px 12px;background:#0a0e1b;border:1px solid var(--line);border-radius:0 0 16px 16px}.nv a.brand::after{display:none}
.brand b{font-size:28px;font-weight:900;letter-spacing:.05em;background:linear-gradient(90deg,#ffd76a,#ff8a3d,#ff5d73,#ffd76a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}.brand span{font-size:11px;letter-spacing:.38em;color:var(--mute)}
main{max-width:1180px;margin:auto;padding:22px 16px 70px}main.fm{max-width:none;padding:0}.pg{animation:pgIn .55s cubic-bezier(.2,.8,.2,1)}
.fr{position:fixed;left:0;right:0;bottom:0;top:var(--nh,84px);width:100%;height:calc(100% - var(--nh,84px));border:0;background:transparent;animation:fin .6s}
.lab{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.ttl{margin:6px 0 20px;font-size:clamp(34px,6vw,58px);font-weight:900;letter-spacing:.03em;background:linear-gradient(90deg,#ffd76a,#ff8a3d,#ff5d73,#ffd76a);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.btn{border:1px solid var(--line);background:var(--pan);padding:10px 20px;border-radius:12px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink);display:inline-block;transition:.15s}.btn:hover{transform:translateY(-2px);background:#1b2440;box-shadow:0 8px 22px #0006}.btn:active{transform:scale(.96)}.btn.p{background:linear-gradient(135deg,#ffc24a,#ff8a3d);color:#2a1500;border:0}.btn.d{color:#ff6b6b}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:22px}
.cd{position:relative;background:linear-gradient(#151d36,#0f1528);border:1px solid var(--line);border-radius:20px;padding:24px;text-decoration:none;color:var(--ink);transition:transform .25s,border-color .25s,box-shadow .25s;animation:up .6s backwards;animation-delay:calc(var(--i)*90ms + .2s);overflow:hidden}
.cd::before{content:'';position:absolute;inset:0;background:radial-gradient(260px 160px at var(--mx,50%) var(--my,0%),#ffc24a22,transparent);opacity:0;transition:.3s}.cd:hover::before{opacity:1}
.cd:hover{transform:translateY(-6px);border-color:#4a5a90;box-shadow:0 18px 40px #000a}.cd i{display:inline-block;font-style:normal;font-size:40px;transition:transform .3s}.cd:hover i{transform:scale(1.2) rotate(-8deg)}.cd h3{margin:8px 0 4px}.cd p{margin:0;color:var(--mute);font-size:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:var(--pan);border-radius:99px;padding:8px 18px;cursor:pointer;font-weight:700;color:var(--mute);transition:.2s;text-decoration:none}.tab:hover{color:var(--ink);transform:translateY(-2px)}.tab.on{background:linear-gradient(135deg,#ffc24a,#ff8a3d);color:#2a1500;border:0}
.doc{background:#111729cc;border:1px solid var(--line);border-radius:20px;padding:26px 30px;animation:up .55s}.doc h2{margin:22px 0 6px;font-size:24px}.doc h2:first-child{margin-top:0}.doc h3{margin:16px 0 4px;color:var(--acc)}.doc li{margin:5px 0}.doc p{color:#cdd4ea}
.su-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.tc{background:var(--pan);border:2px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:.25s;animation:up .5s backwards}.tc:hover{border-color:#3a4a7c;transform:translateY(-3px)}.tc.on{border-color:var(--acc);box-shadow:0 0 30px #ffc24a22}.tc.full{opacity:.5;cursor:not-allowed}
.bar2{height:6px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,#ffc24a,#ff8a3d);transition:width .8s}.mute{color:var(--mute);font-size:13px}
.frm{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}input{background:#0a0f1d;border:1px solid var(--line);border-radius:11px;padding:11px 14px;flex:1;min-width:200px;width:100%;transition:.2s}input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #ffc24a30}.chip{display:inline-block;background:#ffffff10;border-radius:99px;padding:2px 10px;margin:3px 3px 0 0;font-size:13px}
#mg{position:fixed;right:12px;bottom:8px;z-index:60;font-size:11px;color:var(--mute);opacity:.28;cursor:pointer;padding:4px 6px;transition:.3s;user-select:none}#mg:hover{opacity:1}#mg.on{opacity:1;color:#2a1500;background:linear-gradient(135deg,#ffc24a,#ff8a3d);border-radius:99px;padding:5px 13px;font-weight:800;font-size:12px;box-shadow:0 6px 20px #ff8a3d44;animation:pop .4s}
.ov{position:fixed;inset:0;background:#03050bcc;backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:80;overflow:auto;animation:fin .2s}.ov.out{animation:fout .18s forwards}.mdl{background:#131a30;border:1px solid var(--line);border-radius:20px;padding:22px;width:min(460px,100%);display:grid;gap:12px;animation:zoom .3s cubic-bezier(.2,.8,.2,1)}.mdl h3{margin:0}.mdl label{display:grid;gap:5px;font-size:13px;font-weight:600}.row{display:flex;gap:8px;align-items:center}.sp{flex:1}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:90;width:max-content;max-width:92vw}.t{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;animation:up .3s}
@keyframes up{from{opacity:0;transform:translateY(18px)}}@keyframes down{from{opacity:0;transform:translateY(-30px)}}@keyframes fin{from{opacity:0}}@keyframes fout{to{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.5)}}@keyframes zoom{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes pgIn{from{opacity:0;transform:translateY(22px) scale(.99);filter:blur(4px)}}@keyframes shine{to{background-position:250% 0}}@keyframes drift{to{transform:translate(120px,80px) scale(1.2)}}
@media (max-width:900px){.nv{display:flex;flex-wrap:wrap;justify-content:center}.nv .brand{order:-1;flex-basis:100%;margin:0}.g{flex-wrap:wrap}.nv a{padding:11px 10px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<header><nav class="nv">
<div class="g"><a href="#/warmup" data-r="warmup">🎯 PvP Warmup</a><a href="#/tiers" data-r="tiers">👑 PvP Tiers</a></div>
<a class="brand" href="#/home" data-r="home"><b>PvP NERDS</b><span>COMMUNITY</span></a>
<div class="g"><a href="#/tournaments" data-r="tournaments">🏆 Tournaments</a><a href="#/signup" data-r="signup">✍️ Sign Up</a></div>
</nav></header>
<main id="app"></main><div id="modal"></div><div id="toast"></div><a id="mg" onclick="mgr()">manager</a>
<script>
const NS=(location.pathname.split('/')[1]||'root')+':';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function repo(){if(localStorage[NS+'repo'])return localStorage[NS+'repo'];const h=location.hostname;if(!h.endsWith('github.io'))return'';let s=location.pathname.split('/')[1];if(!s||s.endsWith('.html'))s=h;return h.split('.')[0]+'/'+s}
async function fresh(p){const r=repo();if(r){try{const x=await fetch(`https://api.github.com/repos/${r}/contents/${p}`,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(x.ok)return await x.json()}catch(e){}}try{return await(await fetch(p+'?'+Date.now())).json()}catch(e){return null}}
function toast(m,ms=3500){$('#toast').innerHTML='<div class="t">'+esc(m)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').innerHTML='',ms)}
const fr=s=>`<iframe class="fr" src="${s}" title="${s}"></iframe>`,ul=a=>'<ul>'+a.map(x=>`<li>${x}</li>`).join('')+'</ul>';
const INFO={
about:['About Us',()=>`<h2>Welcome to the PvP Nerds Community</h2><p>This is a private competitive PvP group.</p><h3>What do we do?</h3>${ul(['We track our own custom tierlist system so you can compare yourself accurately with other members in the community.','We host monthly tournaments to keep your PvP skills sharp.','We try to keep a kind community without toxicity.'])}<h3>How to get tested</h3>${ul(['Tests are done privately with a testee and a tester.','You can create a ticket in the discord to request a test and a tester will get with you as soon as possible.','The tests are completely based on what you can perform in that gamemode.'])}<h3>How to join a tournament</h3>${ul(['Check the website to see if there is an upcoming tournament.','Sign up on the <a href="#/signup" style="color:var(--acc)">Sign Up</a> page (remember, be fast! There are limited slots.)'])}`],
tiers:['PvP Nerd Tiers',()=>`<h2>Gamemodes</h2><p>The Tierlist consists of these main eight gamemodes. Make a suggestion to add another gamemode.</p>${ul(['Crystal','Mace','Spear Mace','Netherite Pot','Diamond SMP','UHC','SMP','Cart'])}<h2>Tiers</h2><p>These are the official tiers in our tierlist ranking from worst to best:</p><p><b>LT3 · MT3 · HT3 · LT2 · MT2 · HT2 · LT1 · MT1 · HT1</b></p><h2>Tier Interpretation</h2><h3>Tier 3</h3>${ul(['<b>LT3:</b> people who aren’t very good at that gamemode or have never played it (default tier)','<b>MT3:</b> people who can perform some widely used tactics in the gamemode','<b>HT3:</b> know half of known tactics in the gamemode, but still inconsistent'])}<h3>Tier 2</h3>${ul(['<b>LT2:</b> know half of known tactics in the gamemode, and slightly consistent with all','<b>MT2:</b> knows most of known tactics in the gamemode and still not consistent','<b>HT2:</b> can perform all known tactics inconsistently'])}<h3>Tier 1</h3>${ul(['<b>LT1:</b> can perform all known tactics consistently','<b>MT1:</b> second best in this gamemode','<b>HT1:</b> best in this gamemode'])}<p><a class="btn p" href="#/tiers">Open the tier list</a></p>`],
tester:['Becoming a Tester',()=>`<h2>Becoming a Tester</h2><p>These are the steps you must take to become a tester:</p>${ul(['Prove you are the best in the gamemode.','Able to point out most or all tactics used in the gamemode.','Be trusted in the community.','Absolute respect, zero toxicity.'])}<p><b>Complete an application to apply to be a tester!</b></p>`],
tourn:['Tournaments',()=>`<h2>About The System</h2><p>This is the tournament system for The PvP Nerds community. To keep everyone’s PvP skills sharp, you can sign up for new tournaments that will usually happen once a month. This is completely optional, however, you could get rewards just for playing!</p><h2>How to Join</h2><p>Joining a tournament is completely free and there are no risks in participation. Check if there is a scheduled tournament on the website. If there is one that is still accepting players, sign up on the Sign Up page. Each month there will be a new tournament on a different PvP gamemode.</p><h2>Rewards</h2><p>Rewards are generally going to be DonutSMP money. But, if you do not play DonutSMP, there could be other rewards. Let our team know that you would like a different reward when you sign up.</p><p><a class="btn p" href="#/tournaments">Open the tournament tracker</a></p>`],
rules:['Rules & Standards',()=>`<h2>Rules</h2>${ul(['toxicity is not tolerated, you will be immediately disqualified if there is proof','you cannot run an official tournament match without a tournament manager watching the fight live','reward money is for the winner, distributing it to other players is not allowed','when you win a tournament match, do not state so in the Discord as the fight must first be validated by the judges','be nice to all contestants and do not make excuses if you lose (judges will validate the fight completely, so no excuses)'])}<h2>Standards</h2>${ul(['check active tournaments live on the website','a fight is determined by the winner of a first to five game','a tournament match must be done in complete silence if both parties agree','the entire tournament takes place in the chosen server'])}`]};
function info(sub){const k=INFO[sub]&&sub!=='about'?sub:'tiers';return `<div class="pg"><div class="tabs">${Object.entries(INFO).filter(([id])=>id!=='about').map(([id,v])=>`<a class="tab ${id===k?'on':''}" href="#/info/${id}">${v[0]}</a>`).join('')}</div><div class="doc" id="dc">${INFO[k][1]()}</div></div>`}
function home(){$('#app').innerHTML=`<div class="pg"><span class="lab">About Us</span><h1 class="ttl">PvP Nerds Community</h1><div class="doc">${INFO.about[1]()}</div><div class="cards">${[['#/tiers','👑','PvP Tiers','See where every player ranks in each gamemode.'],['#/tournaments','🏆','Tournaments','Follow live brackets, results and rewards.'],['#/warmup','🎯','PvP Warmup','Warm up your clicks, hotkeys, aim and reactions.'],['#/info','📖','Information','Tiers explained, becoming a tester, tournaments and rules.']].map(([h,i,t,d],n)=>`<a class="cd" style="--i:${n}" href="${h}" onmousemove="const r=this.getBoundingClientRect();this.style.setProperty('--mx',event.clientX-r.left+'px');this.style.setProperty('--my',event.clientY-r.top+'px')"><i>${i}</i><h3>${t}</h3><p>${d}</p></a>`).join('')}</div></div>`}
let sel=null;
const plist=(t,su)=>{const rm=(t.rm||[]).map(x=>x.toLowerCase()),have=new Set(t.players.map(p=>p.name.toLowerCase())),o=[...t.players];[...su].sort((a,b)=>a.ts-b.ts).forEach(s=>{const k=s.ign.toLowerCase();if(s.tid===t.id&&!have.has(k)&&!rm.includes(k)&&(!t.max||o.length<t.max)){o.push({name:s.ign});have.add(k)}});return o};
async function signup(){$('#app').innerHTML='<div class="mute">Loading…</div>';let su=[];const [d,F]=await Promise.all([fresh('tournaments/data.json'),import('./fb.js').catch(()=>null)]);if(F){try{su=await F.signups()}catch(e){}}if(location.hash!=='#/signup')return;
 const L=((d&&d.tournaments)||[]).filter(t=>!t.rounds).map(t=>({...t,players:plist(t,su)}));sel=L.find(t=>t.id===sel)?sel:(L.find(t=>!t.max||t.players.length<t.max)||{}).id;
 $('#app').innerHTML=`<div class="pg"><div style="margin-bottom:16px"><h1 style="margin:0">Tournament Sign Up</h1><div class="mute">Pick a tournament, enter your in-game name and you’ll be added instantly.</div></div>${L.length?`<div class="su-grid">${L.map(t=>{const f=t.max&&t.players.length>=t.max;return `<div class="tc ${t.id===sel?'on':''} ${f?'full':''}" onclick="${f?'':`sel='${t.id}';signup()`}"><b style="font-size:18px">${esc(t.title)}</b><div class="mute">${esc(t.server||'')}${t.date?' · '+esc(t.date):''}</div><div style="margin:8px 0">🎁 ${esc(t.prize||'No reward listed')}</div><div class="mute">${t.players.length}${t.max?'/'+t.max:''} signed up${f?' · FULL':''}</div>${t.max?`<div class="bar2"><i style="width:${Math.min(100,t.players.length/t.max*100)}%"></i></div>`:''}<div>${t.players.map(p=>`<span class="chip">${esc(p.name)}</span>`).join('')}</div></div>`}).join('')}</div><div class="frm"><input id="ign" maxlength="16" placeholder="Your Minecraft IGN" value="${esc(localStorage[NS+'ign']||'')}" onkeydown="if(event.key==='Enter')join()"><button class="btn p" onclick="join()">Sign up</button></div>`:'<div class="doc">No tournaments are accepting players right now. Check back soon!</div>'}</div>`}
async function join(){const n=$('#ign').value.trim();if(!sel)return toast('Pick a tournament first');if(!/^[A-Za-z0-9_]{3,16}$/.test(n))return toast('Enter a valid IGN (3–16 letters, numbers or _)');toast('Signing you up…');localStorage[NS+'ign']=n;
 try{const F=await import('./fb.js'),d=await fresh('tournaments/data.json'),su=await F.signups(),t=((d&&d.tournaments)||[]).find(x=>x.id===sel);if(!t||t.rounds)return toast('Registration is closed for that tournament',5000);const l=plist(t,su);if(t.max&&l.length>=t.max)return toast('That tournament is full',5000);if(l.some(p=>p.name.toLowerCase()===n.toLowerCase()))return toast('You are already signed up',5000);await F.signUp(sel,n);toast('✅ You’re in, '+n+'!',5000);signup()}catch(e){toast(e.message||'Could not sign you up',5000)}}
function route(){const [k,sub]=(location.hash.slice(2)||'home').split('/'),a=$('#app'),fm=['tiers','warmup','tournaments'].includes(k);
 document.querySelectorAll('.nv a[data-r]').forEach(e=>e.classList.toggle('on',e.dataset.r===k));document.body.classList.toggle('lock',fm);scrollTo(0,0);document.documentElement.style.setProperty('--nh',$('header').offsetHeight+'px');
 a.className=fm?'fm':'';if(fm)a.innerHTML=fr({tiers:'tierlist/',warmup:'warmup/',tournaments:'tournaments/'}[k]);else if(k==='info')a.innerHTML=info(sub);else if(k==='signup')signup();else home()}
/* manager */
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join(''),DEFH='45759ab951e87ac75248b283a5a94c9ffed866ed37ba6c27abfd46c5d5559f14';let sm=sessionStorage[NS+'sm']==='1';
const mbtn=()=>{$('#mg').textContent=sm?'● Manager mode':'manager';$('#mg').className=sm?'on':''},modal=h=>$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="mdl">${h}</div></div>`,closeM=()=>{const o=document.querySelector('.ov');if(o){o.classList.add('out');setTimeout(()=>o.remove(),180)}};
function mgr(){if(!sm){modal(`<h3>Manager login</h3><input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')mlog()"><div class="row"><div class="sp"></div><button class="btn" onclick="closeM()">Cancel</button><button class="btn p" onclick="mlog()">Sign in</button></div>`);return $('#pw').focus()}
 modal(`<h3>Manager mode</h3><div class="mute">You can now edit tiers, tournaments, warmup hotkeys and more right on each page. Saving needs your GitHub token.</div><label>GitHub token<input id="tk" type="password" value="${esc(localStorage[NS+'tk']||'')}"></label><label>Repository (owner/name)<input id="rp" value="${esc(repo())}"></label><label>New manager password (optional)<input id="np" type="password"></label><div class="row"><button class="btn d" onclick="mout()">Sign out</button><div class="sp"></div><button class="btn" onclick="closeM()">Close</button><button class="btn p" onclick="msave()">Save</button></div>`)}
async function mlog(){const c=await fresh('site.json');if(await sha($('#pw').value)!==((c&&c.mgr)||DEFH))return toast('Wrong password');sm=true;sessionStorage[NS+'sm']='1';closeM();mbtn();route();toast('Manager mode on')}
function mout(){sm=false;sessionStorage[NS+'sm']='0';closeM();mbtn();route()}
async function msave(){localStorage[NS+'tk']=$('#tk').value.trim();localStorage[NS+'repo']=$('#rp').value.trim();const c=(await fresh('site.json'))||{},np=$('#np').value;if(np){if(np.length<6)return toast('Password needs 6+ characters');c.mgr=await sha(np)}
 const tk=localStorage[NS+'tk'].replace(/[\s"']/g,''),r=repo();if(!tk||!r)return toast('Add your token and repository to save');const u=`https://api.github.com/repos/${r}/contents/site.json`,h={Authorization:'Bearer '+tk,Accept:'application/vnd.github+json'};
 try{const g=await fetch(u+'?t='+Date.now(),{headers:h}),j=g.ok?await g.json():null,b={message:'Update site settings',content:btoa(unescape(encodeURIComponent(JSON.stringify(c,null,1))))};if(j&&j.sha)b.sha=j.sha;const p=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify(b)});toast(p.ok?'Saved ✓':'GitHub refused ('+p.status+')');if(p.ok)closeM()}catch(e){toast('Network error')}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});addEventListener('resize',()=>document.documentElement.style.setProperty('--nh',$('header').offsetHeight+'px'));
addEventListener('hashchange',route);mbtn();route();
</script></body></html>
